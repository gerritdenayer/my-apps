<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Apps</title>
<meta name="theme-color" content="#1f5f3a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%93%B1</text></svg>">
<style>
:root{--green:#1f5f3a;--green2:#2e7d4f;--fair:#e8f3ea;--ink:#1b2a21;--muted:#5d6b62;--line:#d5e2d6;--card:#fff;--bg:#f4f7f2}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:40px}
header{background:linear-gradient(160deg,var(--green),var(--green2));color:#fff;padding:22px 16px 30px;border-radius:0 0 24px 24px}
header h1{margin:0 0 4px;font-size:28px}
header .sub{margin:0;opacity:.85;font-size:15px}
main{max-width:640px;margin:0 auto;padding:16px}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:520px){.grid{grid-template-columns:1fr 1fr}}
a.card{display:block;background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);text-decoration:none;color:var(--ink);border:1.5px solid var(--line)}
a.card:active{background:var(--fair)}
.card .name{font-weight:700;font-size:16px;margin-bottom:4px}
.card .folder{color:var(--muted);font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.muted{color:var(--muted)}
footer{max-width:640px;margin:20px auto 0;padding:0 16px;color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body>
<header><h1>📱 My Apps</h1><p class="sub">Overzicht van alle apps in deze repository</p></header>
<main>
<div class="grid" id="grid"></div>
</main>
<footer>Elke app leeft in zijn eigen map onder <code>apps/</code>. Zie README.md voor hoe je een nieuwe app toevoegt.</footer>
<script>
const APPS = [
  {folder:'1on1Manager', name:'1:1 Manager'},
  {folder:'Band Setlist', name:'Band Setlist Manager'},
  {folder:'chord-keys', name:'Chord Keys'},
  {folder:'circle-of-fifths', name:'Circle of Fifths'},
  {folder:'dd-quiz', name:'Who We Are Quiz | Digital & Data'},
  {folder:'golf-knockout', name:'Golf Knockout'},
  {folder:'golf-scoring', name:'Matchplay Live Scoring'},
  {folder:'golf-scoring-v2', name:'Matchplay Live'},
  {folder:'golf-trip-points', name:'Golf Trip Points'},
  {folder:'golfwedstrijd', name:'Golfwedstrijd scoring'},
  {folder:'hello-world', name:'Hello World'},
  {folder:'marketing-hub', name:'Marketing Hub'},
  {folder:'marketing-hub-dev', name:'Marketing Hub (dev)'},
  {folder:'Marokko', name:'Golf Trip Points – Marokko'},
  {folder:'org-chart', name:'Org Chart | Digital & Data'}
];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('grid').innerHTML = APPS
  .sort((a,b)=>a.name.localeCompare(b.name))
  .map(a=>`<a class="card" href="apps/${encodeURIComponent(a.folder)}/"><div class="name">${esc(a.name)}</div><div class="folder">apps/${esc(a.folder)}/</div></a>`)
  .join('');
</script>
</body>
</html>
