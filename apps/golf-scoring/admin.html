<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matchplay Admin</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{ --green:#1b5e20; --green-light:#2e7d32; --blue:#1565c0; --red:#c62828; --cream:#f6f4ea; }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; background:var(--cream); color:#222;}
  header{background:var(--green); color:#fff; padding:14px 20px;}
  header h1{font-size:19px; margin:0; font-weight:600;}
  header .sub{font-size:12px; opacity:.85;}
  .container{max-width:860px; margin:0 auto; padding:16px;}
  .card{background:#fff; border-radius:12px; box-shadow:0 1px 3px rgba(0,0,0,.12); padding:18px; margin-bottom:14px;}
  h2{font-size:16px; margin:0 0 12px;}
  label{display:block; font-size:13px; font-weight:600; margin:10px 0 4px;}
  input[type=text], input[type=password], input[type=number], select{
    width:100%; max-width:340px; padding:9px 10px; border:1.5px solid #ccc; border-radius:8px; font-size:14px;}
  .row{display:flex; gap:14px; flex-wrap:wrap;}
  .row > div{flex:1; min-width:160px;}
  button{border:none; border-radius:8px; padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer;}
  .primary{background:var(--green-light); color:#fff;}
  .secondary{background:#fff; color:#444; border:1.5px solid #bbb;}
  .danger{background:var(--red); color:#fff;}
  .small{padding:6px 10px; font-size:12px;}
  button:disabled{opacity:.45; cursor:default;}
  table{width:100%; border-collapse:collapse; font-size:14px;}
  th,td{text-align:left; padding:7px 8px; border-bottom:1px solid #eee;}
  th{font-size:12px; color:#777; text-transform:uppercase;}
  .badge{display:inline-block; padding:3px 10px; border-radius:12px; font-size:12px; font-weight:700; background:#eee;}
  .badge.live-a{background:#e8f5e9; color:var(--green-light);}
  .badge.live-b{background:#e3f2fd; color:var(--blue);}
  .badge.done{background:var(--green); color:#fff;}
  .badge.as{background:#fff8e1; color:#9e7c00;}
  .muted{color:#888; font-size:13px;}
  .err{color:var(--red); font-size:13px; margin-top:8px;}
  .ok{color:var(--green-light); font-size:13px; margin-top:8px;}
  .teamboard{display:flex; gap:12px; text-align:center; margin-bottom:14px;}
  .tb{flex:1; border-radius:10px; padding:12px;}
  .tb .pts{font-size:34px; font-weight:800;} .tb .nm{font-weight:600; font-size:14px;}
  .tb .proj{font-size:12px; color:#666;}
  .tb.a{background:#e8f5e9;} .tb.b{background:#e3f2fd;}
  .hole-dot{display:inline-flex; width:26px; height:26px; border-radius:50%; align-items:center; justify-content:center;
            font-size:11px; font-weight:700; background:#eee; color:#999; margin:1px;}
  .hole-dot.a{background:var(--green-light); color:#fff;}
  .hole-dot.b{background:var(--blue); color:#fff;}
  .hole-dot.h{background:#bdbdbd; color:#fff;}
  .editbtns{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
  .editbtns .a{background:var(--green-light); color:#fff;}
  .editbtns .b{background:var(--blue); color:#fff;}
  .editbtns .h{background:#757575; color:#fff;}
  .matchsetup{border:1px dashed #bbb; border-radius:10px; padding:12px; margin-top:10px;}
  .pill{display:inline-block; background:#e8f5e9; border-radius:12px; padding:3px 10px; font-size:12px; margin:2px;}
  .filebox{border:2px dashed #aaa; border-radius:10px; padding:18px; text-align:center; color:#777; font-size:13px;}
  .qrcard{text-align:center; border:1px solid #ddd; border-radius:10px; padding:12px; width:230px;}
  .qrcard .lbl{font-weight:600; font-size:13px; margin-bottom:8px;}
  @media print{ header, .noprint{display:none !important;} .card{box-shadow:none;} }
</style>
</head>
<body>
<header>
  <h1>Matchplay Admin</h1>
  <div class="sub" id="hdrSub">Competition management</div>
  <div class="sub" id="hdrMeta" style="opacity:.7"></div>
</header>
<div class="container" id="app"><p class="muted">Loading...</p></div>

<script src="config.js"></script>
<script>
"use strict";
const APP_VERSION = "1.8"; // bump this on every change, same value in index.html
const API = "https://api.jsonbin.io/v3/b/" + APP_CONFIG.JSONBIN_BIN_ID;
const HDRS = {"X-Access-Key": APP_CONFIG.JSONBIN_ACCESS_KEY, "Content-Type":"application/json"};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let data = null;
let draft = null;        // competition being set up
let editingMatch = null; // match id being corrected
let timer = null;
let qrView = false;      // true while the QR code sheet is shown

// ---------- shared logic (same as player page) ----------
function calcStanding(results, holesTotal){
  const played = results.length;
  let diff = 0; results.forEach(r => diff += r);
  const lead = Math.abs(diff);
  const remaining = holesTotal - played;
  if (lead > remaining) return {done:true, winner: diff>0?"A":"B", text: remaining===0 ? lead + "UP" : lead + "&" + remaining, diff, played};
  if (played === holesTotal){
    if (diff === 0) return {done:true, winner:null, text:"AS", diff, played};
    return {done:true, winner: diff>0?"A":"B", text: lead + "UP", diff, played};
  }
  if (played === 0) return {done:false, winner:null, text:"Not started", diff, played};
  let txt = (diff === 0) ? "AS" : lead + "UP";
  if (lead === remaining && lead > 0) txt += " · dormie";
  return {done:false, winner: diff>0?"A":(diff<0?"B":null), text: txt + " thru " + played, diff, played};
}
function sideName(side){ return side.map(esc).join(" & "); }
function teamOf(d, side){
  for (const nm of side){ const p = d.players.find(p=>p.name===nm); if (p && p.team) return p.team; }
  return null;
}
function teamPoints(d){
  const pts={A:0,B:0}, proj={A:0,B:0};
  d.matches.forEach(m=>{
    const st = calcStanding(m.results, d.holes);
    const tA = teamOf(d,m.sideA), tB = teamOf(d,m.sideB);
    if(!tA||!tB) return;
    if (st.done){
      if(!st.winner){pts[tA]+=.5;pts[tB]+=.5;proj[tA]+=.5;proj[tB]+=.5;}
      else {const t=st.winner==="A"?tA:tB; pts[t]+=1; proj[t]+=1;}
    } else if (st.played>0){
      if(!st.winner){proj[tA]+=.5;proj[tB]+=.5;}
      else proj[st.winner==="A"?tA:tB]+=1;
    }
  });
  return {pts, proj};
}
function fmtPts(n){ return (n%1===0)?String(n):n.toFixed(1); }
function fmtTime(ts){
  if (!ts) return "-";
  const d = new Date(ts), now = new Date();
  const hm = d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
  return d.toDateString()===now.toDateString() ? hm : d.toLocaleDateString([], {day:"numeric", month:"short"}) + " " + hm;
}
function lastScoreTs(d){
  let ts = 0; (d.matches||[]).forEach(m=>{ if (m.updatedAt && m.updatedAt > ts) ts = m.updatedAt; });
  return ts || d.updatedAt || 0;
}
function updateHdrMeta(){
  let t = "v" + APP_VERSION;
  if (data && data.format) t += " · scores updated " + fmtTime(lastScoreTs(data));
  if ($("hdrMeta")) $("hdrMeta").textContent = t;
}
function standingBadge(d, m){
  const st = calcStanding(m.results, d.holes);
  if (st.played===0) return '<span class="badge">Not started</span>';
  if (st.done){
    if(!st.winner) return '<span class="badge as">Halved · AS</span>';
    return '<span class="badge done">' + (st.winner==="A"?sideName(m.sideA):sideName(m.sideB)) + ' wins ' + st.text + '</span>';
  }
  if(!st.winner) return '<span class="badge as">' + st.text + '</span>';
  return '<span class="badge ' + (st.winner==="A"?"live-a":"live-b") + '">' +
    (st.winner==="A"?sideName(m.sideA):sideName(m.sideB)) + ' ' + st.text + '</span>';
}
function formatLabel(f){ return {single:"Single Matchplay","4bbb":"4-Ball Best Ball Matchplay",netagg:"Net Aggregate Matchplay"}[f]||f; }
function playersPerSide(f){ return f === "single" ? 1 : 2; }

// ---------- tee boxes & playing handicap ----------
const TEE_COLORS = ["white","yellow","blue","red","orange","pink"];
const COLOR_WORDS = {wit:"white", white:"white", geel:"yellow", yellow:"yellow", blauw:"blue", blue:"blue",
                     rood:"red", red:"red", oranje:"orange", orange:"orange", roze:"pink", pink:"pink"};
function parseTeeLabel(s){
  s = String(s == null ? "" : s).toLowerCase();
  let color = null;
  for (const w in COLOR_WORDS){ if (s.indexOf(w) >= 0){ color = COLOR_WORDS[w]; break; } }
  if (!color) return null;
  let gender = "M";
  if (/\b(l|ladies|lady|dames?|vrouwen?)\b/.test(s)) gender = "L";
  return color + "|" + gender;
}
function teeName(key){
  if (!key) return "-";
  const parts = key.split("|");
  return parts[0].charAt(0).toUpperCase() + parts[0].slice(1) + " (" + parts[1] + ")";
}
function teeIncomplete(t){
  return !(parseFloat(t.par) > 0) || !(parseFloat(t.slope) > 0) || isNaN(parseFloat(String(t.cr).replace(",", ".")));
}
// WHS: course handicap = index x (slope/113) + (CR - par), then x allowance %
function playingHcp(d, p){
  const t = (d.tees || []).find(t=>t.key === p.tee);
  if (!t || teeIncomplete(t)) return null;
  const allow = parseFloat(d.allowance);
  const ch = p.hcp * parseFloat(t.slope)/113 + (parseFloat(String(t.cr).replace(",", ".")) - parseFloat(t.par));
  return Math.round(ch * ((isNaN(allow) ? 100 : allow)/100));
}
function effHcp(d, p){ const ph = playingHcp(d, p); return ph === null ? p.hcp : ph; }

// ---------- data ----------
async function fetchData(){
  const r = await fetch(API + "/latest", {headers: HDRS});
  if (!r.ok) throw new Error("Could not load data (HTTP " + r.status + ")");
  return (await r.json()).record;
}
async function putData(d){
  d.updatedAt = Date.now();
  const r = await fetch(API, {method:"PUT", headers:{...HDRS,"X-Bin-Versioning":"false"}, body: JSON.stringify(d)});
  if (!r.ok) throw new Error("Could not save (HTTP " + r.status + ")");
}

// ---------- PIN gate ----------
function renderPin(){
  $("app").innerHTML =
    '<div class="card" style="max-width:380px;margin:40px auto;">' +
    '<h2>Admin access</h2>' +
    '<label>PIN code</label><input type="password" id="pin" inputmode="numeric">' +
    '<div style="margin-top:14px"><button class="primary" onclick="checkPin()">Open admin</button></div>' +
    '<div class="err" id="pinErr"></div></div>';
  $("pin").addEventListener("keyup", e=>{ if(e.key==="Enter") checkPin(); });
  $("pin").focus();
}
window.checkPin = function(){
  if ($("pin").value === APP_CONFIG.ADMIN_PIN){ sessionStorage.setItem("mpl_admin","1"); start(); }
  else $("pinErr").textContent = "Wrong PIN.";
};

// ---------- main ----------
async function start(){
  $("app").innerHTML = '<p class="muted">Loading...</p>';
  try { data = await fetchData(); }
  catch(e){ $("app").innerHTML = '<div class="card"><p class="err">' + esc(e.message) + '</p><p class="muted">Check JSONBIN_BIN_ID and JSONBIN_ACCESS_KEY in config.js.</p></div>'; return; }
  if (data && data.format) renderBoard(); else startSetup();
  if (timer) clearInterval(timer);
  timer = setInterval(async ()=>{
    if (data && data.format && !editingMatch && !draft && !qrView){
      try { data = await fetchData(); renderBoard(); } catch(e){}
    }
  }, APP_CONFIG.REFRESH_SECONDS * 1000);
}

// ---------- live scoreboard ----------
function renderBoard(){
  qrView = false;
  $("hdrSub").textContent = (data.name||"") + " · " + formatLabel(data.format);
  updateHdrMeta();
  let html = "";
  if (data.useTeams){
    const {pts, proj} = teamPoints(data);
    html += '<div class="teamboard">' +
      '<div class="tb a"><div class="nm">' + esc(data.teamNames.A) + '</div><div class="pts">' + fmtPts(pts.A) + '</div><div class="proj">projected ' + fmtPts(proj.A) + '</div></div>' +
      '<div class="tb b"><div class="nm">' + esc(data.teamNames.B) + '</div><div class="pts">' + fmtPts(pts.B) + '</div><div class="proj">projected ' + fmtPts(proj.B) + '</div></div></div>';
  }
  html += '<div class="card"><h2>Scoreboard <span class="muted" style="font-weight:400">(auto-refreshes)</span></h2>';
  if (data.useTeams){
    // team layout: one column per team, standing in the middle
    html += '<table><thead><tr>' +
      '<th style="color:var(--green-light)">' + esc(data.teamNames.A) + '</th>' +
      '<th style="text-align:center">Standing</th>' +
      '<th style="text-align:right;color:var(--blue)">' + esc(data.teamNames.B) + '</th>' +
      '<th>Holes</th><th></th></tr></thead><tbody>';
    data.matches.forEach(m=>{
      const tA = teamOf(data, m.sideA);
      const left  = (tA === "B") ? m.sideB : m.sideA;  // the side that belongs to team A
      const right = (tA === "B") ? m.sideA : m.sideB;
      const st = calcStanding(m.results, data.holes);
      let leftWin = null;
      if (st.winner) leftWin = (st.winner === "A") !== (tA === "B"); // true when the team A side leads
      const stCls = st.played === 0 ? "" :
        (st.done ? (st.winner ? "done" : "as") : (st.winner ? (leftWin ? "live-a" : "live-b") : "as"));
      const txt = st.played === 0 ? "Not started" : (st.done && !st.winner ? "Halved" : st.text);
      const lStyle = leftWin === true  ? "font-weight:700;color:var(--green-light)" : (leftWin === false ? "color:#999" : "");
      const rStyle = leftWin === false ? "font-weight:700;color:var(--blue)"        : (leftWin === true  ? "color:#999" : "");
      html += '<tr>' +
        '<td style="' + lStyle + '">' + sideName(left) + '</td>' +
        '<td style="text-align:center"><span class="badge ' + stCls + '">' + txt + '</span></td>' +
        '<td style="text-align:right;' + rStyle + '">' + sideName(right) + '</td>' +
        '<td>' + holeDots(m) + '</td>' +
        '<td><button class="secondary small" onclick="editMatch(\'' + m.id + '\')">Correct</button></td></tr>';
      if (editingMatch === m.id) html += '<tr><td colspan="5">' + editPanel(m) + '</td></tr>';
    });
    html += '</tbody></table>';
  } else {
    html += '<table><thead><tr><th>Match</th><th>Standing</th><th>Holes</th><th></th></tr></thead><tbody>';
    data.matches.forEach(m=>{
      html += '<tr><td><b>' + sideName(m.sideA) + '</b> vs <b>' + sideName(m.sideB) + '</b></td>' +
        '<td>' + standingBadge(data, m) + '</td>' +
        '<td>' + holeDots(m) + '</td>' +
        '<td><button class="secondary small" onclick="editMatch(\'' + m.id + '\')">Correct</button></td></tr>';
      if (editingMatch === m.id) html += '<tr><td colspan="4">' + editPanel(m) + '</td></tr>';
    });
    html += '</tbody></table>';
  }
  html += '</div>';
  html += '<div class="card"><h2>Manage</h2>' +
    '<button class="secondary" onclick="addMatchUI()">Add a match</button> ' +
    '<button class="secondary" onclick="showQRs()">Match QR codes</button> ' +
    '<button class="secondary" onclick="editComp()">Edit competition</button> ' +
    '<button class="danger" onclick="clearScores()">Clear all standings</button> ' +
    '<button class="danger" onclick="resetComp()">New competition (deletes current)</button>' +
    '<div id="addMatchBox"></div></div>';
  $("app").innerHTML = html;
}
function holeDots(m){
  return m.results.map((r,i)=>'<span class="hole-dot ' + (r===1?"a":(r===-1?"b":"h")) + '">' + (i+1) + '</span>').join("");
}
function editPanel(m){
  const st = calcStanding(m.results, data.holes);
  let h = '<div class="matchsetup"><b>Correct match</b><div class="muted">Add the next hole result or remove the last one.</div><div class="editbtns">';
  if (!st.done){
    const nh = st.played + 1;
    h += '<button class="a small" onclick="adminRecord(\'' + m.id + '\',1)">' + sideName(m.sideA) + ' won ' + nh + '</button>' +
         '<button class="h small" onclick="adminRecord(\'' + m.id + '\',0)">Halved ' + nh + '</button>' +
         '<button class="b small" onclick="adminRecord(\'' + m.id + '\',-1)">' + sideName(m.sideB) + ' won ' + nh + '</button>';
  }
  h += '<button class="secondary small" onclick="adminUndo(\'' + m.id + '\')" ' + (st.played===0?"disabled":"") + '>Undo last hole</button>' +
       '<button class="secondary small" onclick="deleteMatch(\'' + m.id + '\')">Delete match</button>' +
       '<button class="secondary small" onclick="closeEdit()">Close</button></div></div>';
  return h;
}
window.editMatch = id => { editingMatch = id; renderBoard(); };
window.closeEdit = () => { editingMatch = null; renderBoard(); };
window.adminRecord = async (id,val)=>{
  const m = data.matches.find(x=>x.id===id); m.results.push(val); m.updatedAt = Date.now();
  try { await putData(data); } catch(e){ alert(e.message); }
  renderBoard();
};
window.adminUndo = async id=>{
  const m = data.matches.find(x=>x.id===id); m.results.pop(); m.updatedAt = Date.now();
  try { await putData(data); } catch(e){ alert(e.message); }
  renderBoard();
};
window.deleteMatch = async id=>{
  if (!confirm("Delete this match and its scores?")) return;
  data.matches = data.matches.filter(x=>x.id!==id);
  editingMatch = null;
  try { await putData(data); } catch(e){ alert(e.message); }
  renderBoard();
};
window.clearScores = async ()=>{
  if (!confirm("Clear ALL standings?\n\nEvery hole result of every match will be deleted. Players, matches, course and tee settings are kept.")) return;
  data.matches.forEach(m=>{ m.results = []; m.updatedAt = Date.now(); });
  try { await putData(data); } catch(e){ alert(e.message); }
  renderBoard();
};
window.resetComp = async ()=>{
  const a = prompt('This deletes the current competition and all scores. Saved courses and their tee boxes are kept. Type RESET to confirm.');
  if (a !== "RESET") return;
  const keep = {courses: (data && data.courses) || {}};
  data = keep;
  try { await putData(keep); } catch(e){ alert(e.message); return; }
  startSetup();
};
window.addMatchUI = ()=>{ $("addMatchBox").innerHTML = matchBuilderHTML(data, "live"); };
window.editComp = ()=>{
  draft = JSON.parse(JSON.stringify(data));
  if (!draft.tees) draft.tees = [];
  if (draft.allowance == null) draft.allowance = 100;
  if (!draft.courses) draft.courses = {};
  if (!draft.course) draft.course = "";
  draft._edit = true;
  editingMatch = null;
  renderSetup();
};
window.cancelEdit = ()=>{ draft = null; renderBoard(); };

// ---------- QR codes per match ----------
function playerUrl(){
  return location.href.split("?")[0].split("#")[0].replace(/admin\.html$/i, "") + "index.html";
}
window.showQRs = ()=>{
  qrView = true;
  let h = '<div class="card"><h2>Match QR codes</h2>' +
    '<p class="muted">Each player scans the QR code of their own match: the scoring opens right away and is locked to that match. Print this page for the start sheet.</p>' +
    '<div class="noprint" style="margin-bottom:12px">' +
    '<button class="secondary" onclick="renderBoard()">&#8592; Back to board</button> ' +
    '<button class="secondary" onclick="window.print()">Print</button></div>' +
    '<div style="display:flex;flex-wrap:wrap;gap:16px">';
  data.matches.forEach((m,i)=>{
    h += '<div class="qrcard"><div class="lbl">Match ' + (i+1) + '<br>' + sideName(m.sideA) + '<br><span class="muted">vs</span><br>' + sideName(m.sideB) + '</div>' +
      '<div id="qr' + i + '" style="display:flex;justify-content:center"></div></div>';
  });
  h += '</div></div>';
  $("app").innerHTML = h;
  const base = playerUrl();
  data.matches.forEach((m,i)=>{
    new QRCode($("qr" + i), {text: base + "?match=" + m.id, width: 150, height: 150, correctLevel: QRCode.CorrectLevel.M});
  });
};

// ---------- setup wizard ----------
function startSetup(){
  draft = {name:"", format:"4bbb", holes:18, useTeams:false,
           teamNames:{A:"Team A", B:"Team B"}, allowance:100, course:"", tees:[], players:[], matches:[],
           courses: (data && data.courses) ? JSON.parse(JSON.stringify(data.courses)) : {},
           updatedAt:Date.now()};
  renderSetup();
}
function renderSetup(){
  $("hdrSub").textContent = draft._edit ? "Edit competition" : "New competition setup";
  updateHdrMeta();
  let html = '<div class="card"><h2>1 · Competition</h2><div class="row">' +
    '<div><label>Name</label><input type="text" id="cName" value="' + esc(draft.name) + '" placeholder="e.g. Summer Matchplay 2026"></div>' +
    '<div><label>Format</label><select id="cFormat">' +
      '<option value="4bbb"' + (draft.format==="4bbb"?" selected":"") + '>4-Ball Best Ball MPL</option>' +
      '<option value="single"' + (draft.format==="single"?" selected":"") + '>Single MPL</option>' +
      '<option value="netagg"' + (draft.format==="netagg"?" selected":"") + '>Net Aggregate MPL</option></select></div>' +
    '<div><label>Holes</label><select id="cHoles"><option value="18"' + (draft.holes===18?" selected":"") + '>18</option><option value="9"' + (draft.holes===9?" selected":"") + '>9</option></select></div>' +
    '<div><label>Two teams?</label><select id="cTeams"><option value="no"' + (!draft.useTeams?" selected":"") + '>No, individual matches</option><option value="yes"' + (draft.useTeams?" selected":"") + '>Yes, team competition</option></select></div>' +
    '</div><div class="row" id="teamNamesRow" style="' + (draft.useTeams?"":"display:none") + '">' +
    '<div><label>Team A name <span style="font-weight:400;color:#888" id="tcA"></span></label><input type="text" id="tnA" value="' + esc(draft.teamNames.A) + '"></div>' +
    '<div><label>Team B name <span style="font-weight:400;color:#888" id="tcB"></span></label><input type="text" id="tnB" value="' + esc(draft.teamNames.B) + '"></div></div>' +
    '<div class="row" style="margin-top:14px"><div><label>Course</label>' +
    '<select id="cCourse" onchange="courseChanged(this.value)">' + courseOpts() + '</select></div></div>' +
    '<label style="margin-top:10px">Tee boxes <span style="font-weight:400;color:#888">(Par, Slope and Course Rating, needed for the playing HCP)</span></label>' +
    teeTableHTML() +
    '<button class="secondary small" onclick="addTee()" style="margin-top:8px">Add tee box</button> ' +
    '<button class="secondary small" onclick="saveCourse()" style="margin-top:8px">Save course</button>' +
    '<div id="courseMsg"></div>' +
    '<div class="row" style="margin-top:10px"><div><label>Handicap allowance %</label>' +
    '<input type="number" id="cAllow" value="' + esc(draft.allowance == null ? 100 : draft.allowance) + '" style="max-width:90px"> ' +
    '<span class="muted">100 for singles, 90 is common for 4BBB</span></div></div></div>';

  html += '<div class="card"><h2>2 · Players</h2>' +
    '<div class="filebox">Upload your Excel file (columns: <b>Name</b>, <b>Playing HCP</b>, optionally <b>Team</b>)<br><br>' +
    '<input type="file" id="xlsFile" accept=".xlsx,.xls,.csv"></div>' +
    '<div id="xlsMsg"></div><div id="playerTable">' + playerTableHTML() + '</div>' +
    '<div class="row" style="margin-top:10px;align-items:flex-end">' +
    '<div><label>Add player manually</label><input type="text" id="pName" placeholder="Name"></div>' +
    '<div><label>HCP</label><input type="number" id="pHcp" step="0.1" style="max-width:90px"></div>' +
    '<div><button class="secondary" onclick="addPlayer()">Add</button></div></div></div>';

  html += '<div class="card"><h2>3 · Matches</h2><div id="matchList">' + draftMatchListHTML() + '</div>' +
    '<div style="margin-top:10px"><button class="secondary" onclick="autoMatch()">Auto-create matches (by HCP)</button>' +
    '<div class="muted" id="amMsg" style="margin-top:6px"></div></div>' +
    matchBuilderHTML(draft, "draft") + '</div>';

  const hasMatches = draft.matches.length > 0;
  const hasLive = data && data.format;
  html += '<div class="card"><h2>4 · Save</h2>' +
    '<p class="muted">' + (draft._edit
      ? 'Saving keeps existing scores. Players see the changes right away.'
      : 'Saving publishes the competition to the players.') + '</p>' +
    '<button class="primary" onclick="publish(false)">Save</button> ' +
    (hasMatches ? '<button class="primary" onclick="publish(true)">Save and show scoreboard</button> ' : '') +
    (hasLive ? '<button class="secondary" onclick="cancelEdit()">Return to scoreboard (no save)</button>' : '') +
    '<div id="pubMsg"></div></div>';

  $("app").innerHTML = html;
  updateTeamCounts();
  $("cTeams").onchange = e => { syncDraft(); $("teamNamesRow").style.display = draft.useTeams ? "" : "none"; };
  $("cFormat").onchange = ()=>{ syncDraft(); renderSetup(); };
  $("xlsFile").onchange = handleExcel;
}
function syncDraft(){
  draft.name = $("cName").value.trim();
  draft.format = $("cFormat").value;
  draft.holes = parseInt($("cHoles").value);
  draft.useTeams = $("cTeams").value === "yes";
  if ($("tnA")) { draft.teamNames.A = $("tnA").value.trim() || "Team A"; draft.teamNames.B = $("tnB").value.trim() || "Team B"; }
  if ($("cAllow")) draft.allowance = $("cAllow").value;
  (draft.tees || []).forEach((t,i)=>{
    if (!$("teeC" + i)) return;
    const nk = $("teeC" + i).value + "|" + $("teeG" + i).value;
    if (nk !== t.key){ draft.players.forEach(p=>{ if (p.tee === t.key) p.tee = nk; }); t.key = nk; }
    t.par = $("teeP" + i).value; t.slope = $("teeS" + i).value; t.cr = $("teeR" + i).value;
  });
}
function teeTableHTML(){
  if (!draft.tees.length) return '<p class="muted">No tee boxes yet. Add them here, or import your Excel first (tees are detected automatically).</p>';
  let h = '<table style="max-width:600px"><thead><tr><th>Tee</th><th>M/L</th><th>Par</th><th>Slope</th><th>CR</th><th></th></tr></thead><tbody>';
  draft.tees.forEach((t,i)=>{
    const parts = t.key.split("|");
    const cOpts = TEE_COLORS.map(x=>'<option value="' + x + '"' + (x===parts[0] ? " selected" : "") + '>' + x.charAt(0).toUpperCase() + x.slice(1) + '</option>').join("");
    h += '<tr>' +
      '<td><select id="teeC' + i + '" style="max-width:110px" onchange="teesChanged()">' + cOpts + '</select></td>' +
      '<td><select id="teeG' + i + '" style="max-width:70px" onchange="teesChanged()"><option value="M"' + (parts[1]==="M" ? " selected" : "") + '>M</option><option value="L"' + (parts[1]==="L" ? " selected" : "") + '>L</option></select></td>' +
      '<td><input type="number" id="teeP' + i + '" value="' + esc(t.par) + '" style="max-width:70px" onchange="teesChanged()"></td>' +
      '<td><input type="number" id="teeS' + i + '" value="' + esc(t.slope) + '" style="max-width:70px" onchange="teesChanged()"></td>' +
      '<td><input type="number" step="0.1" id="teeR' + i + '" value="' + esc(t.cr) + '" style="max-width:80px" onchange="teesChanged()"></td>' +
      '<td><button class="secondary small" onclick="removeTee(' + i + ')">Remove</button></td></tr>';
  });
  return h + '</tbody></table>';
}
window.teesChanged = ()=>{ syncDraft(); renderSetup(); };
window.addTee = ()=>{ syncDraft(); draft.tees.push({key:"yellow|M", par:"", slope:"", cr:""}); renderSetup(); };
window.removeTee = i=>{ syncDraft(); draft.tees.splice(i,1); renderSetup(); };

// ---------- courses (saved once, reusable across competitions) ----------
function courseOpts(){
  let o = '<option value=""' + (!draft.course ? " selected" : "") + '>- select course -</option>';
  Object.keys(draft.courses || {}).sort().forEach(c=>{
    o += '<option value="' + esc(c) + '"' + (draft.course===c ? " selected" : "") + '>' + esc(c) + '</option>';
  });
  o += '<option value="__new">+ Add new course...</option>';
  return o;
}
window.courseChanged = v=>{
  syncDraft();
  if (v === "__new"){
    const nm = prompt("Name of the new course:");
    if (nm && nm.trim()){
      draft.course = nm.trim();
      if (!draft.courses[draft.course]) draft.courses[draft.course] = {tees: []};
      draft.tees = [];
    }
  } else if (v){
    draft.course = v;
    draft.tees = JSON.parse(JSON.stringify((draft.courses[v] && draft.courses[v].tees) || []));
  } else {
    draft.course = "";
  }
  renderSetup();
};
window.saveCourse = async ()=>{
  syncDraft();
  if (!draft.course){
    const nm = prompt("Name of the course:");
    if (!nm || !nm.trim()) return;
    draft.course = nm.trim();
  }
  draft.courses[draft.course] = {tees: JSON.parse(JSON.stringify(draft.tees))};
  try{
    // store courses right away, without touching the live competition
    const live = (data && typeof data === "object") ? data : {};
    live.courses = JSON.parse(JSON.stringify(draft.courses));
    await putData(live);
    data = live;
    renderSetup();
    $("courseMsg").innerHTML = '<p class="ok">Course "' + esc(draft.course) + '" saved. You can complete or change it later.</p>';
  } catch(e){
    $("courseMsg").innerHTML = '<p class="err">' + esc(e.message) + '</p>';
  }
};
function playerTableHTML(){
  if (!draft.players.length) return '<p class="muted" style="margin-top:8px">No players yet.</p>';
  const teeOpts = sel => '<option value=""' + (!sel ? " selected" : "") + '>-</option>' +
    draft.tees.map(t=>'<option value="' + esc(t.key) + '"' + (sel===t.key ? " selected" : "") + '>' + teeName(t.key) + '</option>').join("");
  let h = '<table style="margin-top:10px"><thead><tr><th>Name</th><th>HCP index</th><th>Tee</th><th>Playing HCP</th><th>Team</th><th></th></tr></thead><tbody>';
  draft.players.forEach((p,i)=>{
    const ph = playingHcp(draft, p);
    h += '<tr><td>' + esc(p.name) + '</td><td>' + p.hcp + '</td>' +
      '<td><select onchange="setPlayerTee(' + i + ',this.value)">' + teeOpts(p.tee) + '</select></td>' +
      '<td id="php' + i + '">' + (ph===null ? '<span class="muted">-</span>' : '<b>' + ph + '</b>') + '</td>' +
      '<td><select onchange="setTeam(' + i + ',this.value)"><option value=""' + (!p.team?" selected":"") + '>-</option>' +
      '<option value="A"' + (p.team==="A"?" selected":"") + '>A</option><option value="B"' + (p.team==="B"?" selected":"") + '>B</option></select></td>' +
      '<td><button class="secondary small" onclick="removePlayer(' + i + ')">Remove</button></td></tr>';
  });
  return h + '</tbody></table>';
}
window.setPlayerTee = (i,v)=>{
  draft.players[i].tee = v || null;
  const ph = playingHcp(draft, draft.players[i]);
  if ($("php" + i)) $("php" + i).innerHTML = ph===null ? '<span class="muted">-</span>' : '<b>' + ph + '</b>';
};
window.setTeam = (i,v)=>{ draft.players[i].team = v || null; updateTeamCounts(); };
function updateTeamCounts(){
  if (!draft) return;
  const a = draft.players.filter(p=>p.team==="A").length;
  const b = draft.players.filter(p=>p.team==="B").length;
  if ($("tcA")) $("tcA").textContent = "(" + a + " player" + (a===1?"":"s") + ")";
  if ($("tcB")) $("tcB").textContent = "(" + b + " player" + (b===1?"":"s") + ")";
}
window.removePlayer = i=>{
  syncDraft();
  const nm = draft.players[i].name;
  if (draft.matches.some(m=>m.sideA.concat(m.sideB).indexOf(nm) >= 0)){
    alert(nm + " is in a match. Remove that match first."); return;
  }
  draft.players.splice(i,1); renderSetup();
};
window.addPlayer = ()=>{
  syncDraft();
  const n = $("pName").value.trim(), h = parseFloat($("pHcp").value);
  if (!n) return;
  draft.players.push({name:n, hcp:isNaN(h)?0:h, team:null});
  renderSetup();
};
function handleExcel(e){
  syncDraft();
  const f = e.target.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const wb = XLSX.read(new Uint8Array(ev.target.result), {type:"array"});
      let added = 0, withTeam = 0;
      const junk = s => !s || s === "-" || /^tee\s*\d+/i.test(s) || /^speler\s*\d*$/i.test(s);
      const addPlayer = (name, hcp, teamLabel, teeLabel)=>{
        name = String(name == null ? "" : name).trim();
        if (!name || draft.players.some(p=>p.name===name)) return;
        hcp = parseFloat(String(hcp == null ? "" : hcp).replace(",", "."));
        let team = String(teamLabel == null ? "" : teamLabel).trim();
        if (junk(team)) team = "";
        if (team && !/^[AB]$/i.test(team)){
          // map first distinct team label to A, second to B; ignore any further labels
          if (!draft._teamMap) draft._teamMap = {};
          if (!(team in draft._teamMap)){
            const used = Object.values(draft._teamMap);
            if (used.length >= 2){ team = ""; }
            else {
              draft._teamMap[team] = used.includes("A") ? "B" : "A";
              draft.teamNames[draft._teamMap[team]] = team;
              draft.useTeams = true;
            }
          }
          if (team) team = draft._teamMap[team];
        } else team = team.toUpperCase();
        const teeKey = parseTeeLabel(teeLabel);
        if (teeKey && !draft.tees.some(t=>t.key===teeKey)) draft.tees.push({key:teeKey, par:"", slope:"", cr:""});
        draft.players.push({name, hcp: isNaN(hcp)?0:hcp, team: team || null, tee: teeKey || null});
        added++; if (team) withTeam++;
      };
      // scan ALL sheets, not just the first
      wb.SheetNames.forEach(sn=>{
        const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, defval:""});
        // 1) look for a header row with a Name column and a HCP/Handicap column
        let hdrIdx = -1, cName = -1, cHcp = -1, cTeam = -1, cTee = -1;
        for (let i = 0; i < Math.min(aoa.length, 10); i++){
          const row = aoa[i].map(v=>String(v));
          const n = row.findIndex(v=>/^(name|naam|speler|player)s?\b/i.test(v));
          const h = row.findIndex(v=>/hcp|handicap/i.test(v));
          if (n >= 0 && h >= 0){
            hdrIdx = i; cName = n; cHcp = h;
            cTeam = row.findIndex(v=>/team|ploeg/i.test(v));
            cTee = row.findIndex(v=>/tee/i.test(v) && !/team|ploeg/i.test(v));
            break;
          }
        }
        if (hdrIdx >= 0){
          for (let i = hdrIdx + 1; i < aoa.length; i++){
            const row = aoa[i];
            if (junk(String(row[cName]).trim())) continue;
            addPlayer(row[cName], row[cHcp], cTeam >= 0 ? row[cTeam] : "", cTee >= 0 ? row[cTee] : "");
          }
        } else {
          // 2) no headers: look for cells like "NAME Firstname (16,6)"
          const rx = /^(.{2,60}?)\s*\((\d{1,2}(?:[.,]\d+)?)\)\s*$/;
          aoa.forEach(row=>{
            for (let c = 0; c < row.length; c++){
              const m = rx.exec(String(row[c]).trim());
              if (!m || junk(m[1].trim())) continue;
              // tee box = first other cell that looks like a tee label (e.g. "M Geel", "L Rood")
              let tee = "";
              for (let t = 0; t < row.length; t++){
                if (t === c) continue;
                const v = String(row[t]).trim();
                if (v && parseTeeLabel(v)){ tee = v; break; }
              }
              addPlayer(m[1], m[2], "", tee);
              break;
            }
          });
        }
      });
      delete draft._teamMap;
      renderSetup();
      const missing = draft.tees.filter(teeIncomplete).map(t=>teeName(t.key));
      $("xlsMsg").innerHTML = added
        ? '<p class="ok">' + added + ' players imported' + (withTeam ? ' (' + withTeam + ' with a team)' : '') + '.' +
          (missing.length ? '</p><p class="err">Now fill in Par, Slope and CR for: ' + missing.join(", ") + ' (box 1) to calculate the playing HCPs.' : '') + '</p>'
        : '<p class="err">No players found. Expected a sheet with Name and HCP columns, or names like "NAME (16,6)".</p>';
    } catch(err){
      $("xlsMsg").innerHTML = '<p class="err">Could not read file: ' + esc(err.message) + '</p>';
    }
  };
  reader.readAsArrayBuffer(f);
}
function draftMatchListHTML(){
  if (!draft.matches.length) return '<p class="muted">No matches yet. Build them below.</p>';
  let h = '<table><tbody>';
  draft.matches.forEach((m,i)=>{
    h += '<tr><td>Match ' + (i+1) + ': <b>' + sideName(m.sideA) + '</b> vs <b>' + sideName(m.sideB) + '</b></td>' +
      '<td style="text-align:right"><button class="secondary small" onclick="removeDraftMatch(' + i + ')">Remove</button></td></tr>';
  });
  return h + '</tbody></table>';
}
window.removeDraftMatch = i=>{ syncDraft(); draft.matches.splice(i,1); renderSetup(); };

// ---------- auto-match by handicap ----------
window.autoMatch = ()=>{
  syncDraft();
  const n = playersPerSide(draft.format);
  const inM = new Set();
  draft.matches.forEach(m=>m.sideA.concat(m.sideB).forEach(x=>inM.add(x)));
  const avail = team => draft.players
    .filter(p=>!inM.has(p.name) && (!draft.useTeams || p.team===team))
    .sort((a,b)=>effHcp(draft,a)-effHcp(draft,b));
  const mk = (sideA, sideB, i)=>draft.matches.push({id:"m" + Date.now() + "_" + i, sideA, sideB, results:[], updatedAt:Date.now()});
  let created = 0, left = [];
  if (draft.useTeams){
    const A = avail("A"), B = avail("B");
    // full matches first: best players of A vs best players of B, and so on
    while (A.length >= n && B.length >= n){
      mk(A.splice(0,n).map(p=>p.name), B.splice(0,n).map(p=>p.name), created); created++;
    }
    // leftovers play single matches, also in a 4BBB competition
    while (A.length >= 1 && B.length >= 1){
      mk([A.shift().name], [B.shift().name], created); created++;
    }
    left = A.concat(B);
  } else {
    const P = avail(null);
    while (P.length >= 2*n){
      const g = P.splice(0, 2*n);
      if (n === 2) mk([g[0].name, g[3].name], [g[1].name, g[2].name], created); // 1st+4th vs 2nd+3rd for balance
      else mk([g[0].name], [g[1].name], created);
      created++;
    }
    while (P.length >= 2){ const g = P.splice(0,2); mk([g[0].name], [g[1].name], created); created++; }
    left = P;
  }
  renderSetup();
  $("amMsg").textContent = created + " match" + (created===1?"":"es") + " created." +
    (left.length ? " Without a match: " + left.map(p=>p.name).join(", ") + "." : "");
};

let mbPlayers = [];
function matchBuilderHTML(d, mode){
  const src = mode==="draft" ? draft : d;
  const n = playersPerSide(src.format);
  // sorted by playing handicap (falls back to index), lowest first
  const players = src.players.slice().sort((a,b)=>effHcp(src,a)-effHcp(src,b));
  mbPlayers = players.map(p=>({name:p.name, hcp:effHcp(src,p)}));
  const inMatches = new Set();
  src.matches.forEach(m=>{ m.sideA.concat(m.sideB).forEach(x=>inMatches.add(x)); });
  const opts = side => {
    let o = '<option value="">- pick player -</option>';
    players.forEach(p=>{
      // in a team competition, each side only proposes players of that team (plus anyone without a team yet)
      if (src.useTeams && p.team && p.team !== side) return;
      const ph = playingHcp(src, p);
      const tag = (src.useTeams && !p.team ? " [no team]" : (p.team ? " [" + p.team + "]" : "")) +
                  (ph===null ? " (hcp " + p.hcp + ")" : " (php " + ph + ")");
      o += '<option value="' + esc(p.name) + '"' + (inMatches.has(p.name)?' style="color:#aaa"':'') + '>' +
           esc(p.name) + tag + (inMatches.has(p.name)?" *":"") + '</option>';
    });
    return o;
  };
  let h = '<div class="matchsetup"><b>New match</b> <span class="muted">(* = already in a match)</span><div class="row" style="margin-top:8px">';
  h += '<div><label>Side A</label>';
  for (let i=0;i<n;i++) h += '<select id="mbA' + i + '" style="margin-bottom:6px" onchange="updateSideHcp()">' + opts("A") + '</select>';
  h += '<div class="muted" id="mbSumA">HCP total: 0</div>';
  h += '</div><div><label>Side B</label>';
  for (let i=0;i<n;i++) h += '<select id="mbB' + i + '" style="margin-bottom:6px" onchange="updateSideHcp()">' + opts("B") + '</select>';
  h += '<div class="muted" id="mbSumB">HCP total: 0</div>';
  h += '</div></div><button class="secondary" onclick="buildMatch(\'' + mode + '\')">Add match</button><div class="err" id="mbErr"></div></div>';
  return h;
}
window.updateSideHcp = ()=>{
  ["A","B"].forEach(s=>{
    let sum = 0;
    for (let i = 0; ; i++){
      const el = $("mb" + s + i); if (!el) break;
      const p = mbPlayers.find(x=>x.name===el.value);
      if (p) sum += p.hcp;
    }
    const out = $("mbSum" + s);
    if (out) out.textContent = "HCP total: " + (Math.round(sum*10)/10);
  });
};
window.buildMatch = async mode=>{
  const d = mode==="draft" ? draft : data;
  if (mode==="draft") syncDraft();
  const n = playersPerSide(d.format);
  const sideA=[], sideB=[];
  for (let i=0;i<n;i++){ const v=$("mbA"+i).value; if(v) sideA.push(v); }
  for (let i=0;i<n;i++){ const v=$("mbB"+i).value; if(v) sideB.push(v); }
  if (sideA.length !== sideB.length || sideA.length < 1 || sideA.length > n){
    $("mbErr").textContent = n === 1 ? "Pick 1 player per side."
      : "Pick the same number of players on both sides (2 per side, or 1 per side for a single match).";
    return;
  }
  const all = sideA.concat(sideB);
  if (new Set(all).size !== all.length){ $("mbErr").textContent = "A player can only appear once in this match."; return; }
  const m = {id:"m" + Date.now(), sideA, sideB, results:[], updatedAt:Date.now()};
  d.matches.push(m);
  if (mode==="draft") renderSetup();
  else { try { await putData(data); } catch(e){ alert(e.message); } renderBoard(); }
};

window.publish = async (showBoard)=>{
  syncDraft();
  const msg = $("pubMsg");
  if (!draft.name){ msg.innerHTML = '<p class="err">Give the competition a name.</p>'; return; }
  if (showBoard && !draft.players.length){ msg.innerHTML = '<p class="err">Add players first.</p>'; return; }
  if (showBoard && !draft.matches.length){ msg.innerHTML = '<p class="err">Create at least one match.</p>'; return; }
  msg.innerHTML = '<p class="muted">Saving...</p>';
  const wasEdit = draft._edit;
  delete draft._edit;
  // keep the selected course up to date with the tees used in this competition
  if (draft.course) draft.courses[draft.course] = {tees: JSON.parse(JSON.stringify(draft.tees))};
  try {
    await putData(draft);
    data = JSON.parse(JSON.stringify(draft));
    if (showBoard){ draft = null; renderBoard(); }
    else {
      draft._edit = true; // from now on we are editing the live competition
      renderSetup();
      $("pubMsg").innerHTML = '<p class="ok">Saved. Players see the latest version.</p>';
    }
  }
  catch(e){ draft._edit = wasEdit; msg.innerHTML = '<p class="err">' + esc(e.message) + '</p>'; }
};

// ---------- init ----------
(function init(){
  updateHdrMeta();
  if (APP_CONFIG.JSONBIN_BIN_ID.indexOf("PASTE") === 0){
    $("app").innerHTML = '<div class="card"><p class="err">App not configured.</p><p class="muted">Edit <b>config.js</b> first, see SETUP.md.</p></div>';
    return;
  }
  if (sessionStorage.getItem("mpl_admin") === "1") start(); else renderPin();
})();
</script>
