<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matchplay Admin</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{ --green:#1b5e20; --green-light:#2e7d32; --blue:#1565c0; --red:#c62828; --cream:#f6f4ea; }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; background:var(--cream); color:#222;}
  header{background:var(--green); color:#fff; padding:14px 20px;}
  header h1{font-size:19px; margin:0; font-weight:600;}
  header .sub{font-size:12px; opacity:.85;}
  .container{max-width:860px; margin:0 auto; padding:16px;}
  .card{background:#fff; border-radius:12px; box-shadow:0 1px 3px rgba(0,0,0,.12); padding:18px; margin-bottom:14px;}
  h2{font-size:16px; margin:0 0 12px;}
  label{display:block; font-size:13px; font-weight:600; margin:10px 0 4px;}
  input[type=text], input[type=password], input[type=number], select{
    width:100%; max-width:340px; padding:9px 10px; border:1.5px solid #ccc; border-radius:8px; font-size:14px;}
  .row{display:flex; gap:14px; flex-wrap:wrap;}
  .row > div{flex:1; min-width:160px;}
  button{border:none; border-radius:8px; padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer;}
  .primary{background:var(--green-light); color:#fff;}
  .secondary{background:#fff; color:#444; border:1.5px solid #bbb;}
  .danger{background:var(--red); color:#fff;}
  .small{padding:6px 10px; font-size:12px;}
  button:disabled{opacity:.45; cursor:default;}
  table{width:100%; border-collapse:collapse; font-size:14px;}
  th,td{text-align:left; padding:7px 8px; border-bottom:1px solid #eee;}
  th{font-size:12px; color:#777; text-transform:uppercase;}
  .badge{display:inline-block; padding:3px 10px; border-radius:12px; font-size:12px; font-weight:700; background:#eee;}
  .badge.live-a{background:#e8f5e9; color:var(--green-light);}
  .badge.live-b{background:#e3f2fd; color:var(--blue);}
  .badge.done{background:var(--green); color:#fff;}
  .badge.as{background:#fff8e1; color:#9e7c00;}
  .muted{color:#888; font-size:13px;}
  .err{color:var(--red); font-size:13px; margin-top:8px;}
  .ok{color:var(--green-light); font-size:13px; margin-top:8px;}
  .teamboard{display:flex; gap:12px; text-align:center; margin-bottom:14px;}
  .tb{flex:1; border-radius:10px; padding:12px;}
  .tb .pts{font-size:34px; font-weight:800;} .tb .nm{font-weight:600; font-size:14px;}
  .tb .proj{font-size:12px; color:#666;}
  .tb.a{background:#e8f5e9;} .tb.b{background:#e3f2fd;}
  .hole-dot{display:inline-flex; width:26px; height:26px; border-radius:50%; align-items:center; justify-content:center;
            font-size:11px; font-weight:700; background:#eee; color:#999; margin:1px;}
  .hole-dot.a{background:var(--green-light); color:#fff;}
  .hole-dot.b{background:var(--blue); color:#fff;}
  .hole-dot.h{background:#bdbdbd; color:#fff;}
  .editbtns{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
  .editbtns .a{background:var(--green-light); color:#fff;}
  .editbtns .b{background:var(--blue); color:#fff;}
  .editbtns .h{background:#757575; color:#fff;}
  .matchsetup{border:1px dashed #bbb; border-radius:10px; padding:12px; margin-top:10px;}
  .pill{display:inline-block; background:#e8f5e9; border-radius:12px; padding:3px 10px; font-size:12px; margin:2px;}
  .filebox{border:2px dashed #aaa; border-radius:10px; padding:18px; text-align:center; color:#777; font-size:13px;}
  .qrcard{text-align:center; border:1px solid #ddd; border-radius:10px; padding:12px; width:230px;}
  .qrcard .lbl{font-weight:600; font-size:13px; margin-bottom:8px;}
  @media print{ header, .noprint{display:none !important;} .card{box-shadow:none;} }
</style>
</head>
<body>
<header>
  <h1>Matchplay Admin</h1>
  <div class="sub" id="hdrSub">Competition management</div>
  <div class="sub" id="hdrMeta" style="opacity:.7"></div>
</header>
<div class="container" id="app"><p class="muted">Loading...</p></div>

<script src="config.js"></script>
<script>
"use strict";
const APP_VERSION = "2.2.6"; // X.Y.Z - bump the build number (Z) on every build, keep same value in Player.html
const API_BASE = "https://api.jsonbin.io/v3/b";
const HDRS = {"X-Access-Key": APP_CONFIG.JSONBIN_ACCESS_KEY, "Content-Type":"application/json"};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let registry = null;     // {competitions:[{bin,name,created}], courses:{...}}
let compBin = null;      // bin id of the competition currently open
let data = null;
let draft = null;        // competition being set up
let editingMatch = null; // match id being corrected
let timer = null;
let qrView = false;      // true while the QR code sheet is shown
let pendingImport = null; // raw rows held for manual column mapping
let playerSort = {col:null, dir:1}; // current sort of the player table

// ---------- color themes ----------
const THEMES = {
  classic: {label:"Classic green",  green:"#1b5e20", greenLight:"#2e7d32", blue:"#1565c0", cream:"#f6f4ea"},
  ocean:   {label:"Ocean blue",     green:"#0d47a1", greenLight:"#1976d2", blue:"#00838f", cream:"#eef3f8"},
  sunset:  {label:"Sunset orange",  green:"#bf360c", greenLight:"#e64a19", blue:"#6a1b9a", cream:"#fdf3ec"},
  slate:   {label:"Slate gray",     green:"#263238", greenLight:"#455a64", blue:"#00695c", cream:"#f2f4f5"}
};
function applyTheme(t){
  const th = THEMES[t] || THEMES.classic;
  const r = document.documentElement.style;
  r.setProperty("--green", th.green);
  r.setProperty("--green-light", th.greenLight);
  r.setProperty("--blue", th.blue);
  r.setProperty("--cream", th.cream);
}

// ---------- shared logic (same as player page) ----------
function calcStanding(results, holesTotal, tiebreak){
  const played = results.length;
  let diff = 0; results.forEach(r => diff += r);
  const lead = Math.abs(diff);
  if (played > holesTotal){
    // play-off holes beyond regulation
    if (diff === 0) return {done:false, winner:null, text:"AS · play-off", diff, played, playoff:true};
    return {done:true, winner: diff>0?"A":"B", text:"at hole " + played, diff, played};
  }
  const remaining = holesTotal - played;
  if (lead > remaining) return {done:true, winner: diff>0?"A":"B", text: remaining===0 ? lead + "UP" : lead + "&" + remaining, diff, played};
  if (played === holesTotal){
    if (diff === 0){
      if (tiebreak === "playoff") return {done:false, winner:null, text:"AS · play-off", diff, played, playoff:true};
      return {done:true, winner:null, text:"AS", diff, played};
    }
    return {done:true, winner: diff>0?"A":"B", text: lead + "UP", diff, played};
  }
  if (played === 0) return {done:false, winner:null, text:"Not started", diff, played};
  let txt = (diff === 0) ? "AS" : lead + "UP";
  if (lead === remaining && lead > 0) txt += " · dormie";
  return {done:false, winner: diff>0?"A":(diff<0?"B":null), text: txt + " thru " + played, diff, played};
}
function sideName(side){ return side.map(esc).join(" & "); }
// like sideName but appends each player's playing HCP (falls back to exact HCP) in brackets
function sideNameHcp(side){
  return side.map(nm=>{
    const p = draft.players.find(x=>x.name===nm);
    return esc(nm) + (p ? " (" + effHcp(draft, p) + ")" : "");
  }).join(" & ");
}
function teamOf(d, side){
  for (const nm of side){ const p = d.players.find(p=>p.name===nm); if (p && p.team) return p.team; }
  return null;
}
function teamPoints(d){
  const pts={A:0,B:0}, proj={A:0,B:0};
  d.matches.forEach(m=>{
    const st = calcStanding(m.results, d.holes, d.tiebreak);
    const tA = teamOf(d,m.sideA), tB = teamOf(d,m.sideB);
    if(!tA||!tB) return;
    if (st.done){
      if(!st.winner){pts[tA]+=.5;pts[tB]+=.5;proj[tA]+=.5;proj[tB]+=.5;}
      else {const t=st.winner==="A"?tA:tB; pts[t]+=1; proj[t]+=1;}
    } else if (st.played>0){
      if(!st.winner){proj[tA]+=.5;proj[tB]+=.5;}
      else proj[st.winner==="A"?tA:tB]+=1;
    }
  });
  return {pts, proj};
}
function fmtPts(n){ return (n%1===0)?String(n):n.toFixed(1); }
function fmtTime(ts){
  if (!ts) return "-";
  const d = new Date(ts), now = new Date();
  const hm = d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
  return d.toDateString()===now.toDateString() ? hm : d.toLocaleDateString([], {day:"numeric", month:"short"}) + " " + hm;
}
function lastScoreTs(d){
  let ts = 0; (d.matches||[]).forEach(m=>{ if (m.updatedAt && m.updatedAt > ts) ts = m.updatedAt; });
  return ts || d.updatedAt || 0;
}
function updateHdrMeta(){
  let t = "v" + APP_VERSION;
  if (data && data.format) t += " · scores updated " + fmtTime(lastScoreTs(data));
  if ($("hdrMeta")) $("hdrMeta").textContent = t;
}
function standingBadge(d, m){
  const st = calcStanding(m.results, d.holes, d.tiebreak);
  if (st.played===0) return '<span class="badge">Not started</span>';
  if (st.done){
    if(!st.winner) return '<span class="badge as">Halved · AS</span>';
    return '<span class="badge done">' + (st.winner==="A"?sideName(m.sideA):sideName(m.sideB)) + ' wins ' + st.text + '</span>';
  }
  if(!st.winner) return '<span class="badge as">' + st.text + '</span>';
  return '<span class="badge ' + (st.winner==="A"?"live-a":"live-b") + '">' +
    (st.winner==="A"?sideName(m.sideA):sideName(m.sideB)) + ' ' + st.text + '</span>';
}
function formatLabel(f){ return {single:"Single Matchplay","4bbb":"4-Ball Best Ball Matchplay",netagg:"Net Aggregate Matchplay"}[f]||f; }
function playersPerSide(f){ return f === "single" ? 1 : 2; }
// tee times: default interval 8 min for singles, 10 min otherwise
function defaultInterval(d){ return playersPerSide(d.format) === 1 ? 8 : 10; }
function effInterval(d){ const v = parseInt(d.interval); return isNaN(v) ? defaultInterval(d) : v; }
function matchTeeTime(d, i){
  if (!d.startTime) return "";
  const parts = String(d.startTime).split(":");
  const h = parseInt(parts[0]), mm = parseInt(parts[1]);
  if (isNaN(h)) return "";
  const total = h*60 + (isNaN(mm) ? 0 : mm) + i * effInterval(d);
  const hh = Math.floor(total/60) % 24, m2 = ((total % 60) + 60) % 60;
  return String(hh).padStart(2,"0") + ":" + String(m2).padStart(2,"0");
}

// ---------- tee boxes & playing handicap ----------
const TEE_COLORS = ["white","yellow","blue","red","orange","pink"];
const COLOR_WORDS = {wit:"white", white:"white", geel:"yellow", yellow:"yellow", blauw:"blue", blue:"blue",
                     rood:"red", red:"red", oranje:"orange", orange:"orange", roze:"pink", pink:"pink"};
function parseTeeLabel(s){
  s = String(s == null ? "" : s).toLowerCase();
  let color = null;
  for (const w in COLOR_WORDS){ if (s.indexOf(w) >= 0){ color = COLOR_WORDS[w]; break; } }
  if (!color) return null;
  let gender = "M";
  if (/\b(l|ladies|lady|dames?|vrouwen?)\b/.test(s)) gender = "L";
  return color + "|" + gender;
}
function parseTeeColor(s){
  s = String(s == null ? "" : s).toLowerCase();
  for (const w in COLOR_WORDS){ if (s.indexOf(w) >= 0) return COLOR_WORDS[w]; }
  return null;
}
function parseGender(s){
  s = String(s == null ? "" : s).trim().toLowerCase();
  if (!s) return null;
  if (/^(l|d|v|f|female|lady|ladies|dame|dames|vrouw|vrouwen|women|woman|girl|girls)$/.test(s)) return "L";
  if (/^(m|h|male|man|men|heer|heren|jongen|jongens|boy|boys)$/.test(s)) return "M";
  if (/dames|ladies|lady|vrouw|female|wom[ae]n/.test(s)) return "L";
  if (/heren|male|\bmen\b|\bman\b|jongen/.test(s)) return "M";
  return null;
}
function teeName(key){
  if (!key) return "-";
  const parts = key.split("|");
  return parts[0].charAt(0).toUpperCase() + parts[0].slice(1) + " (" + parts[1] + ")";
}
function teeIncomplete(t){
  return !(parseFloat(t.par) > 0) || !(parseFloat(t.slope) > 0) || isNaN(parseFloat(String(t.cr).replace(",", ".")));
}
// WHS: course handicap = index x (slope/113) + (CR - par), then x allowance %
function playingHcp(d, p){
  const t = (d.tees || []).find(t=>t.key === p.tee);
  if (!t || teeIncomplete(t)) return null;
  const allow = parseFloat(d.allowance);
  const ch = p.hcp * parseFloat(t.slope)/113 + (parseFloat(String(t.cr).replace(",", ".")) - parseFloat(t.par));
  return Math.round(ch * ((isNaN(allow) ? 100 : allow)/100));
}
function effHcp(d, p){ const ph = playingHcp(d, p); return ph === null ? p.hcp : ph; }

// ---------- data (registry bin + one bin per competition) ----------
async function binGet(id){
  const r = await fetch(API_BASE + "/" + id + "/latest", {headers: HDRS});
  if (!r.ok) throw new Error("Could not load data (HTTP " + r.status + ")");
  return (await r.json()).record;
}
async function binPut(id, d){
  d.updatedAt = Date.now();
  const r = await fetch(API_BASE + "/" + id, {method:"PUT", headers:{...HDRS,"X-Bin-Versioning":"false"}, body: JSON.stringify(d)});
  if (!r.ok) throw new Error("Could not save (HTTP " + r.status + ")");
}
async function binCreate(d, name){
  d.updatedAt = Date.now();
  const r = await fetch(API_BASE, {method:"POST", headers:{...HDRS, "X-Bin-Name": name || "mpl-competition", "X-Bin-Private":"true"}, body: JSON.stringify(d)});
  if (!r.ok) throw new Error("Could not create storage for the competition (HTTP " + r.status + "). Check that your Access Key has Create rights.");
  return (await r.json()).metadata.id;
}
async function binDelete(id){
  try { await fetch(API_BASE + "/" + id, {method:"DELETE", headers: HDRS}); } catch(e){ /* delete rights are optional */ }
}
function fetchData(){ return binGet(compBin); }
function putData(d){ return binPut(compBin, d); }
async function loadRegistry(){
  registry = await binGet(APP_CONFIG.REGISTRY_BIN_ID);
  if (!registry || typeof registry !== "object") registry = {};
  if (!Array.isArray(registry.competitions)) registry.competitions = [];
  if (!registry.courses) registry.courses = {};
}
function saveRegistry(){ return binPut(APP_CONFIG.REGISTRY_BIN_ID, registry); }

// ---------- PIN gate ----------
function renderPin(){
  $("app").innerHTML =
    '<div class="card" style="max-width:380px;margin:40px auto;">' +
    '<h2>Admin access</h2>' +
    '<label>PIN code</label><input type="password" id="pin" inputmode="numeric">' +
    '<div style="margin-top:14px"><button class="primary" onclick="checkPin()">Open admin</button></div>' +
    '<div class="err" id="pinErr"></div></div>';
  $("pin").addEventListener("keyup", e=>{ if(e.key==="Enter") checkPin(); });
  $("pin").focus();
}
window.checkPin = function(){
  if ($("pin").value === APP_CONFIG.ADMIN_PIN){ sessionStorage.setItem("mpl_admin","1"); start(); }
  else $("pinErr").textContent = "Wrong PIN.";
};

// ---------- main ----------
async function start(){
  $("app").innerHTML = '<p class="muted">Loading...</p>';
  try { await loadRegistry(); }
  catch(e){ $("app").innerHTML = '<div class="card"><p class="err">' + esc(e.message) + '</p><p class="muted">Check REGISTRY_BIN_ID and JSONBIN_ACCESS_KEY in config.js.</p></div>'; return; }
  renderHome();
  if (timer) clearInterval(timer);
  timer = setInterval(async ()=>{
    if (compBin && data && data.format && data.live !== false && !editingMatch && !draft && !qrView){
      try { data = await fetchData(); renderBoard(); } catch(e){}
    }
  }, APP_CONFIG.REFRESH_SECONDS * 1000);
}

// ---------- home: list of competitions ----------
function renderHome(){
  compBin = null; data = null; draft = null; editingMatch = null; qrView = false;
  applyTheme(null);
  $("hdrSub").textContent = "Competitions";
  updateHdrMeta();
  let h = '<div class="card"><h2>Competitions</h2>';
  if (!registry.competitions.length) h += '<p class="muted">No competitions yet. Create your first one below.</p>';
  else {
    h += '<table><thead><tr><th>Name</th><th>Created</th><th></th></tr></thead><tbody>';
    registry.competitions.slice().reverse().forEach(c=>{
      h += '<tr><td><b>' + esc(c.name) + '</b></td><td>' + fmtTime(c.created) + '</td>' +
        '<td style="text-align:right"><button class="secondary small" onclick="openComp(\'' + esc(c.bin) + '\')">Open</button> ' +
        '<button class="danger small" onclick="deleteComp(\'' + esc(c.bin) + '\')">Delete</button></td></tr>';
    });
    h += '</tbody></table>';
  }
  h += '<div style="margin-top:14px"><button class="primary" onclick="newComp()">New competition</button></div></div>';
  $("app").innerHTML = h;
}
window.newComp = ()=>{ compBin = null; data = null; startSetup(); };
window.openComp = async bin=>{
  compBin = bin;
  $("app").innerHTML = '<p class="muted">Loading...</p>';
  try { data = await fetchData(); }
  catch(e){ $("app").innerHTML = '<div class="card"><p class="err">' + esc(e.message) + '</p><button class="secondary" onclick="renderHome()">Back</button></div>'; return; }
  if (data && data.format) renderBoard(); else startSetup();
};
window.deleteComp = async bin=>{
  const c = registry.competitions.find(x=>x.bin===bin);
  const a = prompt('This deletes competition "' + (c ? c.name : "") + '" and all its scores. Saved courses are kept. Type DELETE to confirm.');
  if (a !== "DELETE") return;
  registry.competitions = registry.competitions.filter(x=>x.bin!==bin);
  try { await saveRegistry(); } catch(e){ alert(e.message); return; }
  binDelete(bin);
  renderHome();
};

// ---------- live scoreboard ----------
function renderBoard(){
  qrView = false;
  applyTheme(data.theme);
  $("hdrSub").textContent = (data.name||"") + " · " + formatLabel(data.format);
  updateHdrMeta();
  let html = "";
  if (data.live === false) html += '<div class="card" style="border-left:5px solid var(--red)"><b>Live updates paused.</b> <span class="muted">The player app no longer refreshes or accepts new scores, which saves jsonbin requests. Press "Resume live updates" below to turn live scoring back on.</span></div>';
  if (data.useTeams){
    const {pts, proj} = teamPoints(data);
    html += '<div class="teamboard">' +
      '<div class="tb a"><div class="nm">' + esc(data.teamNames.A) + '</div><div class="pts">' + fmtPts(pts.A) + '</div><div class="proj">projected ' + fmtPts(proj.A) + '</div></div>' +
      '<div class="tb b"><div class="nm">' + esc(data.teamNames.B) + '</div><div class="pts">' + fmtPts(pts.B) + '</div><div class="proj">projected ' + fmtPts(proj.B) + '</div></div></div>';
  }
  html += '<div class="card"><h2>Scoreboard <span class="muted" style="font-weight:400">' + (data.live === false ? '(paused)' : '(auto-refreshes)') + '</span></h2>';
  if (data.useTeams){
    // team layout: one column per team, standing in the middle
    html += '<table><thead><tr>' +
      '<th style="color:var(--green-light)">' + esc(data.teamNames.A) + '</th>' +
      '<th style="text-align:center">Standing</th>' +
      '<th style="text-align:right;color:var(--blue)">' + esc(data.teamNames.B) + '</th>' +
      '<th>Holes</th><th></th></tr></thead><tbody>';
    data.matches.forEach((m,i)=>{
      const tt = matchTeeTime(data, i);
      const tA = teamOf(data, m.sideA);
      const left  = (tA === "B") ? m.sideB : m.sideA;  // the side that belongs to team A
      const right = (tA === "B") ? m.sideA : m.sideB;
      const st = calcStanding(m.results, data.holes, data.tiebreak);
      let leftWin = null;
      if (st.winner) leftWin = (st.winner === "A") !== (tA === "B"); // true when the team A side leads
      const stCls = st.played === 0 ? "" :
        (st.done ? (st.winner ? "done" : "as") : (st.winner ? (leftWin ? "live-a" : "live-b") : "as"));
      const txt = st.played === 0 ? "Not started" : (st.done && !st.winner ? "Halved" : st.text);
      const lStyle = leftWin === true  ? "font-weight:700;color:var(--green-light)" : (leftWin === false ? "color:#999" : "");
      const rStyle = leftWin === false ? "font-weight:700;color:var(--blue)"        : (leftWin === true  ? "color:#999" : "");
      html += '<tr>' +
        '<td style="' + lStyle + '">' + (tt ? '<span class="muted">' + tt + '</span> ' : '') + sideName(left) + '</td>' +
        '<td style="text-align:center"><span class="badge ' + stCls + '">' + txt + '</span></td>' +
        '<td style="text-align:right;' + rStyle + '">' + sideName(right) + '</td>' +
        '<td>' + holeDots(m) + '</td>' +
        '<td><button class="secondary small" onclick="editMatch(\'' + m.id + '\')">Correct</button></td></tr>';
      if (editingMatch === m.id) html += '<tr><td colspan="5">' + editPanel(m) + '</td></tr>';
    });
    html += '</tbody></table>';
  } else {
    html += '<table><thead><tr><th>Match</th><th>Standing</th><th>Holes</th><th></th></tr></thead><tbody>';
    data.matches.forEach((m,i)=>{
      const tt = matchTeeTime(data, i);
      html += '<tr><td>' + (tt ? '<span class="muted">' + tt + '</span> ' : '') + '<b>' + sideName(m.sideA) + '</b> vs <b>' + sideName(m.sideB) + '</b></td>' +
        '<td>' + standingBadge(data, m) + '</td>' +
        '<td>' + holeDots(m) + '</td>' +
        '<td><button class="secondary small" onclick="editMatch(\'' + m.id + '\')">Correct</button></td></tr>';
      if (editingMatch === m.id) html += '<tr><td colspan="4">' + editPanel(m) + '</td></tr>';
    });
    html += '</tbody></table>';
  }
  html += '</div>';
  html += '<div class="card"><h2>Manage</h2>' +
    '<button class="secondary" onclick="renderHome()">&#8592; All competitions</button> ' +
    '<button class="secondary" onclick="addMatchUI()">Add a match</button> ' +
    '<button class="secondary" onclick="showQRs()">Match QR codes</button> ' +

window.sortPlayers = col=>{
  syncDraft();
  if (playerSort.col === col) playerSort.dir *= -1; else { playerSort.col = col; playerSort.dir = 1; }
  const dir = playerSort.dir;
  const val = p => {
    switch (col){
      case 'name': return String(p.name).toLowerCase();
      case 'hcp': return parseFloat(p.hcp) || 0;
      case 'gender': return p.gender || '';
      case 'tee': return p.tee ? teeName(p.tee) : '';
      case 'php': return effHcp(draft, p);
      case 'team': return p.team || '';
      default: return '';
    }
  };
  draft.players.sort((a,b)=>{ const va = val(a), vb = val(b); if (va < vb) return -dir; if (va > vb) return dir; return 0; });
  renderSetup();
};

// turn a raw team label into A / B (maps the first two distinct labels), updates team names
function mapTeamLabel(team){
  team = String(team == null ? "" : team).trim();
  if (!team || /^tee\s*\d+/i.test(team)) return "";
  if (/^[AB]$/i.test(team)) return team.toUpperCase();
  if (!draft._teamMap) draft._teamMap = {};
  if (!(team in draft._teamMap)){
    const used = Object.values(draft._teamMap);
    if (used.length >= 2) return "";
    draft._teamMap[team] = used.includes("A") ? "B" : "A";
    draft.teamNames[draft._teamMap[team]] = team;
    draft.useTeams = true;
  }
  return draft._teamMap[team];
}
// add or update one player from raw cell values; returns "added" | "updated" | "skipped"
function importPlayer(name, hcp, teamLabel, teeLabel, genderLabel){
  name = String(name == null ? "" : name).trim();
  if (!name) return "skipped";
  hcp = parseFloat(String(hcp == null ? "" : hcp).replace(",", "."));
  const team = mapTeamLabel(teamLabel);
  const color = parseTeeColor(teeLabel);
  const gender = parseGender(genderLabel) || parseGender(teeLabel) || (color ? "M" : null);
  const teeKey = color ? color + "|" + (gender || "M") : null;
  if (teeKey && !draft.tees.some(t=>t.key===teeKey)) draft.tees.push({key:teeKey, par:"", slope:"", cr:""});
  // already in the list? update the record with whatever the file provides, keep the rest
  const existing = draft.players.find(p=>String(p.name).trim().toLowerCase() === name.toLowerCase());
  if (existing){
    if (!isNaN(hcp)) existing.hcp = hcp;
    if (gender) existing.gender = gender;
    if (teeKey) existing.tee = teeKey;
    else if (gender && existing.tee){
      const want = existing.tee.split("|")[0] + "|" + gender;
      if (draft.tees.some(t=>t.key===want)) existing.tee = want;
    }
    if (team) existing.team = team;
    return "updated";
  }
  draft.players.push({name, hcp: isNaN(hcp)?0:hcp, team: team || null, gender: gender || null, tee: teeKey || null});
  return "added";
}
function importMsg(added, updated, withTeam, removed, keptInMatch){
  removed = removed || 0; keptInMatch = keptInMatch || [];
  if (!added && !updated && !removed){ $("xlsMsg").innerHTML = '<p class="err">No players found in the file.</p>'; return; }
  const missing = draft.tees.filter(teeIncomplete).map(t=>teeName(t.key));
  const bits = [];
  if (added) bits.push(added + " player" + (added===1?"":"s") + " imported" + (withTeam ? " (" + withTeam + " with a team)" : ""));
  if (updated) bits.push(updated + " updated");
  if (removed) bits.push(removed + " removed");
  let html = '<p class="ok">' + bits.join(", ") + '.</p>';
  if (keptInMatch.length) html += '<p class="muted">Not in the file but kept because they are in a match: ' + esc(keptInMatch.join(", ")) + '. Remove the match first to delete them.</p>';
  if (missing.length) html += '<p class="err">Now fill in Par, Slope and CR for: ' + missing.join(", ") + ' (box 1) to calculate the playing HCPs.</p>';
  $("xlsMsg").innerHTML = html;
}
// after an import, offer to delete players who were not in the uploaded file
function reconcileStale(seen){
  const stale = draft.players.filter(p => !seen.has(String(p.name).trim().toLowerCase()));
  if (!stale.length) return {removed:0, keptInMatch:[]};
  const inMatch = new Set();
  draft.matches.forEach(m=>m.sideA.concat(m.sideB).forEach(x=>inMatch.add(x)));
  const removable = stale.filter(p=>!inMatch.has(p.name));
  const keptInMatch = stale.filter(p=>inMatch.has(p.name)).map(p=>p.name);
  if (!removable.length) return {removed:0, keptInMatch};
  const names = removable.map(p=>p.name).join(", ");
  if (!confirm(removable.length + " player(s) are no longer in the uploaded file:\n\n" + names + "\n\nRemove them from the player list?")) return {removed:0, keptInMatch};
  const drop = new Set(removable.map(p=>p.name));
  draft.players = draft.players.filter(p=>!drop.has(p.name));
  return {removed:removable.length, keptInMatch};
}
function handleExcel(e){
  syncDraft();
  const f = e.target.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const wb = XLSX.read(new Uint8Array(ev.target.result), {type:"array"});
      let added = 0, updated = 0, withTeam = 0;
      const seen = new Set();
      const junk = s => !s || s === "-" || /^tee\s*\d+/i.test(s) || /^speler\s*\d*$/i.test(s);
      const add = (name, hcp, teamLabel, teeLabel, genderLabel)=>{
        const r = importPlayer(name, hcp, teamLabel, teeLabel, genderLabel);
        if (r === "added"){ added++; if (draft.players[draft.players.length-1].team) withTeam++; }
        else if (r === "updated"){ updated++; }
        if (r !== "skipped") seen.add(String(name).trim().toLowerCase());
      };
      let bestSheet = null, bestLen = -1;
      // scan ALL sheets, not just the first
      wb.SheetNames.forEach(sn=>{
        const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, defval:""});
        if (aoa.length > bestLen){ bestLen = aoa.length; bestSheet = aoa; }
        // 1) look for a header row with a Name column and an exact HCP / Handicap column
        let hdrIdx = -1, cName = -1, cHcp = -1, cTeam = -1, cTee = -1, cGender = -1;
        for (let i = 0; i < Math.min(aoa.length, 10); i++){
          const row = aoa[i].map(v=>String(v));
          const n = row.findIndex(v=>/^(name|naam|speler|player)s?\b/i.test(v));
          let h = row.findIndex(v=>/exact|index/i.test(v));
          if (h < 0) h = row.findIndex(v=>/(hcp|handicap)/i.test(v) && !/playing|speel/i.test(v));
          if (h < 0) h = row.findIndex(v=>/hcp|handicap/i.test(v));
          if (n >= 0 && h >= 0){
            hdrIdx = i; cName = n; cHcp = h;
            cTeam = row.findIndex(v=>/team|ploeg/i.test(v));
            cTee = row.findIndex(v=>/tee|baan|kleur|colou?r/i.test(v) && !/team|ploeg/i.test(v));
            cGender = row.findIndex(v=>/gender|sex|geslacht|m\/v/i.test(v) && !/tee|kleur/i.test(v));
            break;
          }
        }
        if (hdrIdx >= 0){
          for (let i = hdrIdx + 1; i < aoa.length; i++){
            const row = aoa[i];
            if (junk(String(row[cName]).trim())) continue;
            add(row[cName], row[cHcp], cTeam >= 0 ? row[cTeam] : "", cTee >= 0 ? row[cTee] : "", cGender >= 0 ? row[cGender] : "");
          }
        } else {
          // 2) no headers: look for cells like "NAME Firstname (16,6)"
          const rx = /^(.{2,60}?)\s*\((\d{1,2}(?:[.,]\d+)?)\)\s*$/;
          aoa.forEach(row=>{
            for (let c = 0; c < row.length; c++){
              const m = rx.exec(String(row[c]).trim());
              if (!m || junk(m[1].trim())) continue;
              // scan the other cells for a tee color and a gender
              let tee = "", gen = "";
              for (let t = 0; t < row.length; t++){
                if (t === c) continue;
                const v = String(row[t]).trim();
                if (v && !tee && parseTeeColor(v)) tee = v;
                if (v && !gen && parseGender(v)) gen = v;
              }
              add(m[1], m[2], "", tee, gen);
              break;
            }
          });
        }
      });
      delete draft._teamMap;
      if (added || updated){
        const rec = reconcileStale(seen);
        renderSetup();
        importMsg(added, updated, withTeam, rec.removed, rec.keptInMatch);
      } else {
        // auto-detect failed: let the organizer map the columns by hand
        pendingImport = (bestSheet && bestSheet.length) ? bestSheet : null;
        if (pendingImport) renderColumnMapping();
        else $("xlsMsg").innerHTML = '<p class="err">No data found in the file.</p>';
      }
    } catch(err){
      $("xlsMsg").innerHTML = '<p class="err">Could not read file: ' + esc(err.message) + '</p>';
    }
  };
  reader.readAsArrayBuffer(f);
}
function colLetter(c){ let s = ""; c++; while (c > 0){ const m = (c-1) % 26; s = String.fromCharCode(65+m) + s; c = Math.floor((c-1)/26); } return s; }
function renderColumnMapping(){
  const rows = pendingImport;
  const colCount = rows.reduce((mx,r)=>Math.max(mx, r.length), 0);
  const hdr = rows[0] || [];
  const colOpts = sel => { let o = '<option value="-1">- none -</option>'; for (let c = 0; c < colCount; c++){ const lbl = (hdr[c] != null && String(hdr[c]).trim()) ? String(hdr[c]) : ("Column " + colLetter(c)); o += '<option value="' + c + '"' + (c===sel ? " selected" : "") + '>' + esc(lbl) + '</option>'; } return o; };
  const guess = re => { for (let c = 0; c < colCount; c++){ if (re.test(String(hdr[c] || ""))) return c; } return -1; };
  let prev = '<table style="font-size:12px;border-collapse:collapse"><tbody>';
  rows.slice(0, 4).forEach(r=>{ prev += '<tr>' + Array.from({length: colCount}).map((_,c)=>'<td style="border:1px solid #eee;padding:2px 6px">' + esc(String(r[c] == null ? "" : r[c])) + '</td>').join("") + '</tr>'; });
  prev += '</tbody></table>';
  $("xlsMsg").innerHTML =
    '<div class="card" style="background:#fffef5;border:1px solid #f0e6b0">' +
    '<b>Map your columns</b><div class="muted">I could not recognize the columns automatically. Pick which column is which. Preview of the first rows:</div>' +
    '<div style="overflow:auto;margin:8px 0">' + prev + '</div>' +
    '<div class="row">' +
    '<div><label>Name *</label><select id="mapName">' + colOpts(guess(/name|naam|speler|player/i)) + '</select></div>' +
    '<div><label>Exact HCP *</label><select id="mapHcp">' + colOpts(guess(/exact|index|hcp|handicap/i)) + '</select></div>' +
    '<div><label>Gender</label><select id="mapGender">' + colOpts(guess(/gender|sex|geslacht|m\/v/i)) + '</select></div>' +
    '<div><label>Tee color</label><select id="mapTee">' + colOpts(guess(/tee|kleur|colou?r|baan/i)) + '</select></div>' +
    '<div><label>Team</label><select id="mapTeam">' + colOpts(guess(/team|ploeg/i)) + '</select></div>' +
    '</div>' +
    '<div class="row" style="margin-top:8px"><div><label>First data row</label><input type="number" id="mapStart" min="1" value="2" style="max-width:90px"></div></div>' +
    '<div style="margin-top:10px"><button class="primary" onclick="doMappedImport()">Import with this mapping</button> ' +
    '<button class="secondary" onclick="cancelMapping()">Cancel</button></div>' +
    '<div class="err" id="mapErr"></div></div>';
}
window.cancelMapping = ()=>{ pendingImport = null; $("xlsMsg").innerHTML = ""; };
window.doMappedImport = ()=>{
  const rows = pendingImport; if (!rows) return;
  const cName = parseInt($("mapName").value), cHcp = parseInt($("mapHcp").value);
  const cGen = parseInt($("mapGender").value), cTee = parseInt($("mapTee").value), cTeam = parseInt($("mapTeam").value);
  if (cName < 0 || cHcp < 0){ $("mapErr").textContent = "Pick at least the Name and Exact HCP columns."; return; }
  const start = Math.max(1, parseInt($("mapStart").value) || 1) - 1;
  let added = 0, updated = 0, withTeam = 0;
  const seen = new Set();
  for (let i = start; i < rows.length; i++){
    const row = rows[i]; if (!row) continue;
    const r = importPlayer(row[cName], row[cHcp], cTeam >= 0 ? row[cTeam] : "", cTee >= 0 ? row[cTee] : "", cGen >= 0 ? row[cGen] : "");
    if (r === "added"){ added++; if (draft.players[draft.players.length-1].team) withTeam++; }
    else if (r === "updated"){ updated++; }
    if (r !== "skipped") seen.add(String(row[cName]).trim().toLowerCase());
  }
  delete draft._teamMap;
  pendingImport = null;
  const rec = reconcileStale(seen);
  renderSetup();
  importMsg(added, updated, withTeam, rec.removed, rec.keptInMatch);
};
function draftMatchListHTML(){
  if (!draft.matches.length) return '<p class="muted" style="margin-top:8px">No matches yet. Build them below.</p>';
  const showTimes = !!draft.startTime;
  const n = draft.matches.length;
  let h = '<table style="margin-top:8px"><tbody>';
  draft.matches.forEach((m,i)=>{
    const t = showTimes ? '<b>' + matchTeeTime(draft, i) + '</b> &middot; ' : '';
    h += '<tr draggable="true" ondragstart="dragStart(event,' + i + ')" ondragover="dragOver(event)" ondrop="dropMatch(event,' + i + ')" ondragend="dragEnd(event)" style="cursor:move">' +
      '<td style="width:20px;color:#bbb">&#9776;</td>' +
      '<td>' + t + 'Match ' + (i+1) + ': <b>' + sideNameHcp(m.sideA) + '</b> vs <b>' + sideNameHcp(m.sideB) + '</b></td>' +
      '<td style="text-align:right;white-space:nowrap">' +
      '<button class="secondary small" onclick="moveDraftMatch(' + i + ',-1)" ' + (i===0?"disabled":"") + ' title="Move up">&#9650;</button> ' +
      '<button class="secondary small" onclick="moveDraftMatch(' + i + ',1)" ' + (i===n-1?"disabled":"") + ' title="Move down">&#9660;</button> ' +
      '<button class="secondary small" onclick="removeDraftMatch(' + i + ')">Remove</button></td></tr>';
  });
  return h + '</tbody></table>';
}
window.removeDraftMatch = i=>{ syncDraft(); draft.matches.splice(i,1); renderSetup(); };
window.removeAllMatches = ()=>{
  if (!draft.matches.length) return;
  if (!confirm("Remove all " + draft.matches.length + " matches? Players and their settings are kept.")) return;
  syncDraft(); draft.matches = []; renderSetup();
};
window.moveDraftMatch = (i,dir)=>{
  syncDraft();
  const j = i + dir;
  if (j < 0 || j >= draft.matches.length) return;
  const a = draft.matches;
  const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  $("matchList").innerHTML = draftMatchListHTML();
};
window.timesChanged = ()=>{ syncDraft(); $("matchList").innerHTML = draftMatchListHTML(); };
let dragIdx = null;
window.dragStart = (e,i)=>{ dragIdx = i; e.dataTransfer.effectAllowed = "move"; try{ e.dataTransfer.setData("text/plain", String(i)); }catch(_){} };
window.dragOver = e=>{ e.preventDefault(); e.dataTransfer.dropEffect = "move"; };
window.dropMatch = (e,i)=>{
  e.preventDefault();
  if (dragIdx === null || dragIdx === i) return;
  syncDraft();
  const a = draft.matches;
  const moved = a.splice(dragIdx, 1)[0];
  a.splice(i, 0, moved);
  dragIdx = null;
  $("matchList").innerHTML = draftMatchListHTML();
};
window.dragEnd = ()=>{ dragIdx = null; };

// ---------- auto-match by handicap ----------
window.autoMatch = ()=>{
  syncDraft();
  const n = playersPerSide(draft.format);
  const inM = new Set();
  draft.matches.forEach(m=>m.sideA.concat(m.sideB).forEach(x=>inM.add(x)));
  const avail = team => draft.players
    .filter(p=>!inM.has(p.name) && (!draft.useTeams || p.team===team))
    .sort((a,b)=>effHcp(draft,a)-effHcp(draft,b));
  const mk = (sideA, sideB, i)=>draft.matches.push({id:"m" + Date.now() + "_" + i, sideA, sideB, results:[], updatedAt:Date.now()});
  let created = 0, left = [];
  if (draft.useTeams){
    const A = avail("A"), B = avail("B");
    // full matches first: best players of A vs best players of B, and so on
    while (A.length >= n && B.length >= n){
      mk(A.splice(0,n).map(p=>p.name), B.splice(0,n).map(p=>p.name), created); created++;
    }
    // leftovers play single matches, also in a 4BBB competition
    while (A.length >= 1 && B.length >= 1){
      mk([A.shift().name], [B.shift().name], created); created++;
    }
    left = A.concat(B);
  } else {
    const P = avail(null);
    while (P.length >= 2*n){
      const g = P.splice(0, 2*n);
      if (n === 2) mk([g[0].name, g[3].name], [g[1].name, g[2].name], created); // 1st+4th vs 2nd+3rd for balance
      else mk([g[0].name], [g[1].name], created);
      created++;
    }
    while (P.length >= 2){ const g = P.splice(0,2); mk([g[0].name], [g[1].name], created); created++; }
    left = P;
  }
  renderSetup();
  $("amMsg").textContent = created + " match" + (created===1?"":"es") + " created." +
    (left.length ? " Without a match: " + left.map(p=>p.name).join(", ") + "." : "");
};

let mbPlayers = [];
function matchBuilderHTML(d, mode){
  const src = mode==="draft" ? draft : d;
  const n = playersPerSide(src.format);
  // sorted by playing handicap (falls back to index), lowest first
  const players = src.players.slice().sort((a,b)=>effHcp(src,a)-effHcp(src,b));
  mbPlayers = players.map(p=>({name:p.name, hcp:effHcp(src,p)}));
  const inMatches = new Set();
  src.matches.forEach(m=>{ m.sideA.concat(m.sideB).forEach(x=>inMatches.add(x)); });
  const opts = side => {
    let o = '<option value="">- pick player -</option>';
    players.forEach(p=>{
      if (inMatches.has(p.name)) return;                      // already in a match: leave out
      if (src.useTeams && p.team && p.team !== side) return;   // not this team: leave out
      const ph = playingHcp(src, p);
      const tag = (src.useTeams && !p.team ? " [no team]" : "") +
                  (ph===null ? " (hcp " + p.hcp + ")" : " (php " + ph + ")");
      o += '<option value="' + esc(p.name) + '">' + esc(p.name) + tag + '</option>';
    });
    return o;
  };
  const labelA = src.useTeams ? esc(src.teamNames.A) : "Side A";
  const labelB = src.useTeams ? esc(src.teamNames.B) : "Side B";
  let h = '<div class="matchsetup"><b>New match</b><div class="row" style="margin-top:8px">';
  h += '<div><label>' + labelA + '</label>';
  for (let i=0;i<n;i++) h += '<select id="mbA' + i + '" style="margin-bottom:6px" onchange="updateSideHcp()">' + opts("A") + '</select>';
  h += '<div class="muted" id="mbSumA">HCP total: 0</div>';
  h += '</div><div><label>' + labelB + '</label>';
  for (let i=0;i<n;i++) h += '<select id="mbB' + i + '" style="margin-bottom:6px" onchange="updateSideHcp()">' + opts("B") + '</select>';
  h += '<div class="muted" id="mbSumB">HCP total: 0</div>';
  h += '</div></div><button class="secondary" onclick="buildMatch(\'' + mode + '\')">Add match</button><div class="err" id="mbErr"></div></div>';
  return h;
}
window.updateSideHcp = ()=>{
  ["A","B"].forEach(s=>{
    let sum = 0;
    for (let i = 0; ; i++){
      const el = $("mb" + s + i); if (!el) break;
      const p = mbPlayers.find(x=>x.name===el.value);
      if (p) sum += p.hcp;
    }
    const out = $("mbSum" + s);
    if (out) out.textContent = "HCP total: " + (Math.round(sum*10)/10);
  });
};
window.buildMatch = async mode=>{
  const d = mode==="draft" ? draft : data;
  if (mode==="draft") syncDraft();
  const n = playersPerSide(d.format);
  const sideA=[], sideB=[];
  for (let i=0;i<n;i++){ const v=$("mbA"+i).value; if(v) sideA.push(v); }
  for (let i=0;i<n;i++){ const v=$("mbB"+i).value; if(v) sideB.push(v); }
  if (sideA.length !== sideB.length || sideA.length < 1 || sideA.length > n){
    $("mbErr").textContent = n === 1 ? "Pick 1 player per side."
      : "Pick the same number of players on both sides (2 per side, or 1 per side for a single match).";
    return;
  }
  const all = sideA.concat(sideB);
  if (new Set(all).size !== all.length){ $("mbErr").textContent = "A player can only appear once in this match."; return; }
  const m = {id:"m" + Date.now(), sideA, sideB, results:[], updatedAt:Date.now()};
  d.matches.push(m);
  if (mode==="draft") renderSetup();
  else { try { await putData(data); } catch(e){ alert(e.message); } renderBoard(); }
};

window.publish = async (showBoard)=>{
  syncDraft();
  const msg = $("pubMsg");
  if (!draft.name){ msg.innerHTML = '<p class="err">Give the competition a name.</p>'; return; }
  if (showBoard && !draft.players.length){ msg.innerHTML = '<p class="err">Add players first.</p>'; return; }
  if (showBoard && !draft.matches.length){ msg.innerHTML = '<p class="err">Create at least one match.</p>'; return; }
  msg.innerHTML = '<p class="muted">Saving...</p>';
  const wasEdit = draft._edit;
  delete draft._edit;
  // keep the selected course up to date with the tees used in this competition
  if (draft.course) draft.courses[draft.course] = {tees: JSON.parse(JSON.stringify(draft.tees))};
  registry.courses = JSON.parse(JSON.stringify(draft.courses));
  // the competition bin does not contain the course library, only its own data
  const out = JSON.parse(JSON.stringify(draft));
  delete out.courses;
  try {
    if (!compBin){
      compBin = await binCreate(out, "mpl-" + (draft.name || "competition").toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 40));
      registry.competitions.push({bin: compBin, name: draft.name, created: Date.now()});
    } else {
      await putData(out);
      const reg = registry.competitions.find(c=>c.bin===compBin);
      if (reg) reg.name = draft.name;
    }
    await saveRegistry();
    data = out;
    if (showBoard){ draft = null; renderBoard(); }
    else {
      draft._edit = true; // from now on we are editing the live competition
      renderSetup();
      $("pubMsg").innerHTML = '<p class="ok">Saved. Players see the latest version.</p>';
    }
  }
  catch(e){ draft._edit = wasEdit; msg.innerHTML = '<p class="err">' + esc(e.message) + '</p>'; }
};

(function init(){
  updateHdrMeta();
  if (APP_CONFIG.REGISTRY_BIN_ID.indexOf("PASTE") === 0){
    $("app").innerHTML = '<div class="card"><p class="err">App not configured.</p><p class="muted">Edit <b>config.js</b> first, see SETUP.md.</p></div>';
    return;
  }
  if (sessionStorage.getItem("mpl_admin") === "1") start(); else renderPin();
})();
