<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Matchplay Live Scoring</title>
<style>
  :root{
    --green:#1b5e20; --green-light:#2e7d32; --cream:#f6f4ea;
    --blue:#1565c0; --red:#c62828; --grey:#757575; --gold:#f9a825;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; background:var(--cream); color:#222;}
  header{background:var(--green); color:#fff; padding:14px 16px; position:sticky; top:0; z-index:10;
         display:flex; justify-content:space-between; align-items:center;}
  header h1{font-size:18px; margin:0; font-weight:600;}
  header .sub{font-size:12px; opacity:.85;}
  .container{max-width:560px; margin:0 auto; padding:12px;}
  .card{background:#fff; border-radius:12px; box-shadow:0 1px 3px rgba(0,0,0,.12); padding:14px; margin-bottom:12px;}
  .match-card{cursor:pointer;}
  .match-card:active{background:#f0efe6;}
  .match-card.mine{border:2px solid var(--green-light);}
  .mine-tag{text-align:center; font-size:12px; font-weight:700; color:var(--green-light); margin-top:6px;}
  .sides{display:flex; align-items:center; gap:8px;}
  .side{flex:1; font-size:15px; font-weight:600; line-height:1.3;}
  .side.right{text-align:right;}
  .side.leading{color:var(--green-light);}
  .side.trailing{color:#999;}
  .vs{font-size:11px; color:#aaa;}
  .standing{text-align:center; margin-top:8px; font-size:14px; font-weight:700;}
  .standing .badge{display:inline-block; padding:3px 12px; border-radius:14px; background:#eee;}
  .badge.live-a{background:#e8f5e9; color:var(--green-light);}
  .badge.live-b{background:#e3f2fd; color:var(--blue);}
  .badge.done{background:var(--green); color:#fff;}
  .badge.as{background:#fff8e1; color:#9e7c00;}
  .teamboard{display:flex; gap:10px; text-align:center;}
  .teamboard .tb{flex:1; border-radius:10px; padding:10px;}
  .teamboard .tb .pts{font-size:30px; font-weight:800;}
  .teamboard .tb .nm{font-size:13px; font-weight:600;}
  .teamboard .tb .proj{font-size:11px; color:#666;}
  .tb.a{background:#e8f5e9;} .tb.b{background:#e3f2fd;}
  .muted{color:#888; font-size:13px; text-align:center;}
  /* entry view */
  .holebig{text-align:center; margin:6px 0 2px; font-size:15px; color:#555;}
  .standbig{text-align:center; font-size:34px; font-weight:800; margin:4px 0 14px;}
  .standbig.a{color:var(--green-light);} .standbig.b{color:var(--blue);} .standbig.as{color:#9e7c00;}
  .btn{display:block; width:100%; border:none; border-radius:14px; padding:18px 12px; font-size:17px;
       font-weight:700; margin-bottom:10px; color:#fff; cursor:pointer;}
  .btn:active{opacity:.8;}
  .btn-a{background:var(--green-light);} .btn-b{background:var(--blue);}
  .btn-half{background:var(--grey);}
  .btn-ghost{background:#fff; color:#555; border:1.5px solid #ccc; font-weight:600; padding:12px;}
  .btn:disabled{opacity:.4; cursor:default;}
  .holes-strip{display:flex; flex-wrap:wrap; gap:4px; justify-content:center; margin:10px 0;}
  .hole-dot{width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
            font-size:12px; font-weight:700; background:#eee; color:#999;}
  .hole-dot.a{background:var(--green-light); color:#fff;}
  .hole-dot.b{background:var(--blue); color:#fff;}
  .hole-dot.h{background:#bdbdbd; color:#fff;}
  .back{background:none; border:none; color:#fff; font-size:15px; cursor:pointer; padding:4px;}
  .finished-banner{text-align:center; background:var(--green); color:#fff; border-radius:10px;
                   padding:12px; font-size:18px; font-weight:700; margin-bottom:12px;}
  .formathint{font-size:12px; color:#888; text-align:center; margin-bottom:10px;}
  .toast{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#333; color:#fff;
         padding:10px 18px; border-radius:20px; font-size:14px; opacity:0; transition:opacity .3s; z-index:99;}
  .toast.show{opacity:1;}
  .refresh-note{text-align:center; font-size:11px; color:#aaa; margin:4px 0 14px;}
</style>
</head>
<body>
<header>
  <div>
    <h1 id="hdrTitle">Matchplay Live</h1>
    <div class="sub" id="hdrSub"></div>
    <div class="sub" id="hdrMeta" style="opacity:.7"></div>
  </div>
  <button class="back" id="btnBack" style="display:none">&#8592; Matches</button>
</header>

<div class="container" id="app">
  <p class="muted">Loading...</p>
</div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
"use strict";
const APP_VERSION = "2.2.6"; // X.Y.Z - bump the build number (Z) on every build, keep same value in admin.html
const API_BASE = "https://api.jsonbin.io/v3/b";
const HDRS = {"X-Access-Key": APP_CONFIG.JSONBIN_ACCESS_KEY, "Content-Type":"application/json"};

let registry = null;      // {competitions:[...]}
let compBin = null;       // bin id of the competition being viewed
let data = null;          // competition data
let view = "list";        // "list" | "entry"
let currentMatchId = null;
let timer = null;

// ---------- color themes (same as admin) ----------
const THEMES = {
  classic: {green:"#1b5e20", greenLight:"#2e7d32", blue:"#1565c0", cream:"#f6f4ea"},
  ocean:   {green:"#0d47a1", greenLight:"#1976d2", blue:"#00838f", cream:"#eef3f8"},
  sunset:  {green:"#bf360c", greenLight:"#e64a19", blue:"#6a1b9a", cream:"#fdf3ec"},
  slate:   {green:"#263238", greenLight:"#455a64", blue:"#00695c", cream:"#f2f4f5"}
};
function applyTheme(t){
  const th = THEMES[t] || THEMES.classic;
  const r = document.documentElement.style;
  r.setProperty("--green", th.green);
  r.setProperty("--green-light", th.greenLight);
  r.setProperty("--blue", th.blue);
  r.setProperty("--cream", th.cream);
}

// the match this phone is allowed to score, set by scanning the match QR code (?bin=...&match=...)
let myMatchId = null;
(function(){
  const q = new URLSearchParams(location.search);
  const b = q.get("bin"), p = q.get("match");
  if (b){
    compBin = b;
    if (p){ myMatchId = p; try{ localStorage.setItem("mpl_my_match_" + b, p); }catch(e){} }
    else { try{ myMatchId = localStorage.getItem("mpl_my_match_" + b); }catch(e){} }
  }
})();

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}

// ---------- standings logic ----------
function calcStanding(results, holesTotal, tiebreak){
  const played = results.length;
  let diff = 0; results.forEach(r => diff += r);
  const lead = Math.abs(diff);
  if (played > holesTotal){
    // play-off holes beyond regulation
    if (diff === 0) return {done:false, winner:null, text:"AS · play-off", diff, played, playoff:true};
    return {done:true, winner: diff>0?"A":"B", text:"at hole " + played, diff, played};
  }
  const remaining = holesTotal - played;
  if (lead > remaining)
    return {done:true, winner: diff>0?"A":"B", text: remaining===0 ? lead + "UP" : lead + "&" + remaining, diff, played};
  if (played === holesTotal){
    if (diff === 0){
      if (tiebreak === "playoff") return {done:false, winner:null, text:"AS · play-off", diff, played, playoff:true};
      return {done:true, winner:null, text:"AS", diff, played};
    }
    return {done:true, winner: diff>0?"A":"B", text: lead + "UP", diff, played};
  }
  if (played === 0) return {done:false, winner:null, text:"Not started", diff, played};
  let txt = (diff === 0) ? "AS" : lead + "UP";
  if (lead === remaining && lead > 0) txt += " · dormie";
  return {done:false, winner: diff>0?"A":(diff<0?"B":null), text: txt + " thru " + played, diff, played};
}

function sideName(side){ return side.map(esc).join(" & "); }

function standingBadge(m){
  const st = calcStanding(m.results, data.holes, data.tiebreak);
  if (st.played === 0) return '<span class="badge">Not started</span>';
  if (st.done){
    if (!st.winner) return '<span class="badge as">Halved · AS</span>';
    const w = st.winner === "A" ? sideName(m.sideA) : sideName(m.sideB);
    return '<span class="badge done">' + w + ' wins ' + st.text + '</span>';
  }
  if (!st.winner) return '<span class="badge as">' + st.text + '</span>';
  const cls = st.winner === "A" ? "live-a" : "live-b";
  const w = st.winner === "A" ? sideName(m.sideA) : sideName(m.sideB);
  return '<span class="badge ' + cls + '">' + w + ' ' + st.text + '</span>';
}

function teamPoints(){
  const pts = {A:0, B:0}, proj = {A:0, B:0};
  data.matches.forEach(m=>{
    const st = calcStanding(m.results, data.holes, data.tiebreak);
    const tA = teamOf(m.sideA), tB = teamOf(m.sideB);
    if (!tA || !tB) return;
    if (st.done){
      if (!st.winner){ pts[tA]+=.5; pts[tB]+=.5; proj[tA]+=.5; proj[tB]+=.5; }
      else { const t = st.winner==="A"?tA:tB; pts[t]+=1; proj[t]+=1; }
    } else if (st.played>0){
      if (!st.winner){ proj[tA]+=.5; proj[tB]+=.5; }
      else proj[st.winner==="A"?tA:tB]+=1;
    }
  });
  return {pts, proj};
}
function teamOf(side){
  for (const nm of side){
    const p = data.players.find(p=>p.name===nm);
    if (p && p.team) return p.team;
  }
  return null;
}

// ---------- data ----------
async function binGet(id){
  const r = await fetch(API_BASE + "/" + id + "/latest", {headers: HDRS});
  if (!r.ok) throw new Error("Could not load data (" + r.status + ")");
  return (await r.json()).record;
}
function fetchData(){ return binGet(compBin); }
async function loadRegistry(){
  registry = await binGet(APP_CONFIG.REGISTRY_BIN_ID);
  if (!registry || typeof registry !== "object") registry = {};
  if (!Array.isArray(registry.competitions)) registry.competitions = [];
}

async function saveMatchResults(matchId, results){
  // re-fetch first so we never overwrite other matches
  const fresh = await fetchData();
  const m = fresh.matches.find(x=>x.id===matchId);
  if (!m) throw new Error("Match not found");
  m.results = results;
  m.updatedAt = Date.now();
  fresh.updatedAt = Date.now();
  const r = await fetch(API_BASE + "/" + compBin, {method:"PUT", headers:{...HDRS, "X-Bin-Versioning":"false"}, body: JSON.stringify(fresh)});
  if (!r.ok) throw new Error("Could not save (" + r.status + ")");
  data = fresh;
}

// ---------- competition list (when no QR / bin in the link) ----------
function renderCompList(){
  applyTheme(null);
  $("hdrTitle").textContent = "Matchplay Live";
  $("hdrSub").textContent = "Pick your competition";
  updateHdrMeta();
  $("btnBack").style.display = "none";
  let html = "";
  const comps = registry.competitions.slice().reverse();
  if (!comps.length) html = '<p class="muted">No competitions yet.<br>Ask the organizer to publish one.</p>';
  comps.forEach(c=>{
    html += '<div class="card match-card" onclick="openComp(\'' + esc(c.bin) + '\')">' +
      '<div class="side">' + esc(c.name) + '</div></div>';
  });
  $("app").innerHTML = html;
}
window.openComp = async bin=>{
  compBin = bin;
  try{ myMatchId = localStorage.getItem("mpl_my_match_" + bin); }catch(e){ myMatchId = null; }
  view = "list"; currentMatchId = null;
  $("app").innerHTML = '<p class="muted">Loading...</p>';
  await refresh();
};
window.showComps = async ()=>{
  compBin = null; data = null; myMatchId = null; view = "list"; currentMatchId = null;
  $("app").innerHTML = '<p class="muted">Loading...</p>';
  try { await loadRegistry(); renderCompList(); }
  catch(e){ $("app").innerHTML = '<p class="muted">Could not load competitions.<br>' + esc(e.message) + '</p>'; }
};

function fmtTime(ts){
  if (!ts) return "-";
  const d = new Date(ts), now = new Date();
  const hm = d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
  return d.toDateString()===now.toDateString() ? hm : d.toLocaleDateString([], {day:"numeric", month:"short"}) + " " + hm;
}
function lastScoreTs(d){
  let ts = 0; (d.matches||[]).forEach(m=>{ if (m.updatedAt && m.updatedAt > ts) ts = m.updatedAt; });
  return ts || d.updatedAt || 0;
}
function updateHdrMeta(){
  let t = "v" + APP_VERSION;
  if (data && data.format) t += " · scores updated " + fmtTime(lastScoreTs(data));
  if ($("hdrMeta")) $("hdrMeta").textContent = t;
}

// ---------- views ----------
function render(){
  updateHdrMeta();
  if (!data || !data.format){
    $("app").innerHTML = '<p class="muted">This competition is not set up yet.<br>Ask the organizer, or <a href="#" onclick="showComps();return false">pick another competition</a>.</p>';
    return;
  }
  applyTheme(data.theme);
  $("hdrTitle").textContent = data.name || "Matchplay Live";
  $("hdrSub").textContent = formatLabel(data.format) + " · " + data.holes + " holes";
  if (view === "list") renderList(); else renderEntry();
  $("btnBack").style.display = view === "entry" ? "block" : "none";
}

function formatLabel(f){
  return {single:"Single Matchplay", "4bbb":"4-Ball Best Ball Matchplay", netagg:"Net Aggregate Matchplay"}[f] || f;
}

function renderList(){
  let html = "";
  if (data.live === false) html += '<div class="finished-banner">Competition closed &middot; live scoring paused</div>';
  if (data.useTeams){
    const {pts, proj} = teamPoints();
    html += '<div class="card teamboard">'
      + '<div class="tb a"><div class="nm">' + esc(data.teamNames.A) + '</div><div class="pts">' + fmtPts(pts.A) + '</div><div class="proj">projected ' + fmtPts(proj.A) + '</div></div>'
      + '<div class="tb b"><div class="nm">' + esc(data.teamNames.B) + '</div><div class="pts">' + fmtPts(pts.B) + '</div><div class="proj">projected ' + fmtPts(proj.B) + '</div></div>'
      + '</div>';
  }
  if (!data.matches.length) html += '<p class="muted">No matches yet.</p>';
  data.matches.forEach(m=>{
    const st = calcStanding(m.results, data.holes, data.tiebreak);
    const aCls = st.diff>0 ? "leading" : (st.diff<0 ? "trailing" : "");
    const bCls = st.diff<0 ? "leading" : (st.diff>0 ? "trailing" : "");
    const mine = m.id === myMatchId;
    html += '<div class="card match-card' + (mine ? ' mine' : '') + '" onclick="openMatch(\'' + m.id + '\')">'
      + '<div class="sides"><div class="side ' + aCls + '">' + sideName(m.sideA) + '</div>'
      + '<div class="vs">vs</div>'
      + '<div class="side right ' + bCls + '">' + sideName(m.sideB) + '</div></div>'
      + '<div class="standing">' + standingBadge(m) + '</div>'
      + (mine ? '<div class="mine-tag">Your match · tap to enter scores</div>' : '')
      + '</div>';
  });
  html += '<p class="refresh-note">' +
    (myMatchId && data.matches.some(m=>m.id===myMatchId)
      ? 'Tap your match to enter scores · other matches are view-only'
      : 'View only · scan your match QR code to enter scores') +
    (data.live === false ? ' · live updates paused' : ' · refreshes every ' + APP_CONFIG.REFRESH_SECONDS + 's') + '<br>' +
    '<a href="#" onclick="showComps();return false">&laquo; All competitions</a></p>';
  $("app").innerHTML = html;
}
function fmtPts(n){ return (n % 1 === 0) ? String(n) : n.toFixed(1).replace(".0",""); }

const HINTS = {
  single: "Enter who won each hole (with handicap strokes applied).",
  "4bbb": "Best ball counts: enter which pair won the hole (net).",
  netagg: "Add both partners' net scores; lowest total wins the hole."
};

function renderEntry(){
  const m = data.matches.find(x=>x.id===currentMatchId);
  if (!m){ view="list"; renderList(); return; }
  const mine = m.id === myMatchId;
  const st = calcStanding(m.results, data.holes, data.tiebreak);
  const nextHole = st.played + 1;

  let strip = "";
  m.results.forEach((r,i)=>{
    const cls = r===1?"a":(r===-1?"b":"h");
    strip += '<div class="hole-dot ' + cls + '">' + (i+1) + '</div>';
  });

  let html = '<div class="card">';
  if (mine) html += '<div class="formathint">' + HINTS[m.sideA.length===1 ? "single" : data.format] + '</div>';
  if (st.done){
    const wname = st.winner ? (st.winner==="A"?sideName(m.sideA):sideName(m.sideB)) + " wins " + st.text : "Match halved (AS)";
    html += '<div class="finished-banner">' + wname + '</div>';
  } else {
    html += '<div class="holebig">' + (nextHole > data.holes ? 'Play-off hole ' + nextHole : 'Hole ' + nextHole + ' of ' + data.holes) + '</div>';
    const cls = st.diff>0?"a":(st.diff<0?"b":"as");
    let line = st.played===0 ? "All square" :
      (st.diff===0 ? "All square thru " + st.played :
       (st.winner==="A"?sideName(m.sideA):sideName(m.sideB)) + " " + st.text.replace(" thru "," thru "));
    html += '<div class="standbig ' + cls + '">' + line + '</div>';
    if (mine && data.live !== false){
      html += '<button class="btn btn-a" onclick="record(1)">' + sideName(m.sideA) + ' won hole ' + nextHole + '</button>';
      html += '<button class="btn btn-half" onclick="record(0)">Hole halved</button>';
      html += '<button class="btn btn-b" onclick="record(-1)">' + sideName(m.sideB) + ' won hole ' + nextHole + '</button>';
    } else if (mine){
      html += '<p class="muted">Scoring is paused by the organizer.</p>';
    }
  }
  html += '<div class="holes-strip">' + strip + '</div>';
  if (mine && data.live !== false) html += '<button class="btn btn-ghost" onclick="undoHole()" ' + (st.played===0?"disabled":"") + '>Undo last hole</button>';
  else html += '<p class="muted">View only · scores are entered by the players of this match</p>';
  html += '</div>';
  $("app").innerHTML = html;
}

// ---------- actions ----------
window.openMatch = function(id){ currentMatchId = id; view = "entry"; render(); };

let saving = false;
window.record = async function(val){
  if (saving || currentMatchId !== myMatchId) return;
  saving = true;
  const m = data.matches.find(x=>x.id===currentMatchId);
  const newResults = m.results.concat([val]);
  m.results = newResults; render();           // optimistic update
  try { await saveMatchResults(currentMatchId, newResults); render(); }
  catch(e){ toast("Save failed, check connection"); }
  saving = false;
};

window.undoHole = async function(){
  if (saving || currentMatchId !== myMatchId) return;
  saving = true;
  const m = data.matches.find(x=>x.id===currentMatchId);
  const newResults = m.results.slice(0,-1);
  m.results = newResults; render();
  try { await saveMatchResults(currentMatchId, newResults); render(); toast("Last hole removed"); }
  catch(e){ toast("Save failed, check connection"); }
  saving = false;
};

$("btnBack").onclick = ()=>{ view = "list"; currentMatchId = null; refresh(); };

// ---------- refresh loop ----------
async function refresh(){
  try {
    data = await fetchData(); render();
    // competition stopped by the organizer: stop polling jsonbin to save requests
    if (data && data.live === false && timer){ clearInterval(timer); timer = null; }
  }
  catch(e){ $("app").innerHTML = '<p class="muted">Could not load data.<br>' + esc(e.message) + '<br><br>Check config.js (bin ID and access key).</p>'; }
}

(function init(){
  updateHdrMeta();
  if (APP_CONFIG.REGISTRY_BIN_ID.indexOf("PASTE") === 0){
    $("app").innerHTML = '<p class="muted">App not configured yet.<br>Edit <b>config.js</b> first (see SETUP.md).</p>';
    return;
  }
  if (compBin){
    refresh().then(()=>{
      // scanned a match QR code: open that match right away
      if (myMatchId && data && data.format && data.matches.some(m=>m.id===myMatchId)){
        currentMatchId = myMatchId; view = "entry"; render();
      }
    });
  } else {
    showComps();
  }
  timer = setInterval(()=>{ if (compBin && view==="list" && !saving && !(data && data.live===false)) refresh(); }, APP_CONFIG.REFRESH_SECONDS * 1000);
})();
</script>
</body>
</html>
